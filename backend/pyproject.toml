[project]
name = "orbweaver"
version = "0.1.0"
description = "Orbweaver agent backend: memory, sessions, channels"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "anthropic>=0.40.0",
  "asyncpg>=0.30.0",
  "numpy>=2.0.0",
  "python-multipart>=0.0.12",
  "python-telegram-bot>=21.0",
  "apscheduler>=3.10.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0.0"]
stt = ["faster-whisper>=1.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.scripts]
orbweaver = "orbweaver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orbweaver*"]

[tool.setuptools.package-data]
orbweaver = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
