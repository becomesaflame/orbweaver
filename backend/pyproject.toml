[project]
name = "orbweaver"
dynamic = ["version"]
description = "Orbweaver agent backend: memory, sessions, channels"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "anthropic>=0.40.0",
  "asyncpg>=0.30.0",
  "numpy>=2.0.0",
  "python-multipart>=0.0.12",
  "python-telegram-bot>=21.0",
  "apscheduler>=3.10.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0.0"]
stt = ["faster-whisper>=1.0.0"]
browser = ["playwright>=1.40.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "mypy>=1.13.0"]

[project.scripts]
orbweaver = "orbweaver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "orbweaver.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["orbweaver*"]

[tool.setuptools.package-data]
orbweaver = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "vscode/node_modules", "vscode/out", "web/node_modules"]

[tool.ruff.lint]
# ASYNC: blocking subprocess/file/HTTP/sleep calls inside async functions stall
# the gateway event loop for every session (issue #98).
extend-select = ["ASYNC"]
# B008: FastAPI Depends()/File() defaults. BLE001: optional-dep and HTML parse fallbacks.
# ASYNC109: async functions may take a `timeout` parameter (Bash tool API).
ignore = ["B008", "BLE001", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Tests may do blocking file I/O inside async test functions.
"tests/**" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["orbweaver"]

[tool.mypy]
python_version = "3.12"
pretty = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
exclude = ["(?x)(\\.venv|vscode|web)"]
