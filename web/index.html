<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbweaver</title>
  <style>
    :root {
      --bg:#0b0b0f; --chrome:#1e1e24; --rail:#16161c; --panel:#14141a;
      --ink:#d8d8e0; --accent:#78ffa0; --muted:#7a7a88; --line:#050506;
      --hover:#26262e; --active:#102418; --lcd:#070b07; --lcd-ink:#78ffa0;
      --lcd-dim:#3d8a55; --amber:#ffb028; --bevel-hi:#3a3a44; --bevel-lo:#050506;
      --face:#2a2a32;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body {
      font: 13px/1.45 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background:var(--bg); color:var(--ink);
      display:flex; padding:0.45rem; gap:0.45rem;
    }
    #rail, #stage {
      background: linear-gradient(180deg, #2a2a32 0%, var(--chrome) 12%, #18181e 100%);
      box-shadow:
        inset 1px 1px 0 var(--bevel-hi),
        inset -1px -1px 0 var(--bevel-lo),
        0 2px 0 #000;
    }
    #rail {
      width:17.5rem; min-width:17.5rem;
      display:flex; flex-direction:column;
    }
    .brand {
      display:flex; align-items:baseline; justify-content:space-between; gap:0.6rem;
      padding:0.55rem 0.7rem 0.35rem;
    }
    .brand h1 {
      font-size:0.82rem; margin:0; font-weight:800; letter-spacing:0.14em;
      text-transform:uppercase; color:var(--lcd-ink);
      text-shadow:0 0 8px rgba(120,255,160,0.35);
    }
    .brand .ver {
      font: 0.68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color:var(--lcd-dim); letter-spacing:0.04em;
    }
    .rail-actions { padding:0.2rem 0.55rem 0.45rem; display:flex; flex-direction:column; gap:0.35rem; }
    button {
      font: inherit; color:var(--ink); background:transparent;
      border:0; border-radius:2px; padding:0.4rem 0.55rem; cursor:pointer; text-align:left;
    }
    button:hover { background:var(--hover); }
    .btn-new, .ghost, #send, #ws-use, .mic {
      background: linear-gradient(180deg, #3a3a44 0%, var(--face) 48%, #1c1c22 100%);
      box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo), 0 1px 0 #000;
    }
    .btn-new {
      color:var(--lcd-ink); font-weight:700; letter-spacing:0.06em;
      text-transform:uppercase; font-size:0.72rem;
      display:flex; align-items:center; gap:0.45rem;
    }
    .btn-new:hover { filter:brightness(1.08); background: linear-gradient(180deg, #44444e 0%, #32323a 48%, #222228 100%); }
    .search, #settings input, #settings textarea, #composer textarea, #model, #ws-modal footer input {
      background:var(--lcd); color:var(--lcd-ink);
      border:1px solid var(--bevel-lo);
      box-shadow: inset 1px 1px 3px #000, inset -1px -1px 0 #1a2a1c;
      border-radius:2px;
      font: 0.82rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .search {
      width:100%; padding:0.38rem 0.5rem;
    }
    .search::placeholder { color:var(--lcd-dim); }
    .rail-list { flex:1; overflow-y:auto; padding:0.15rem 0.4rem 0.6rem; }
    .sec-label {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.45rem 0.4rem 0.2rem;
      font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--amber);
    }
    .sec-label .tcount { color:var(--lcd-dim); letter-spacing:0.04em; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .icon-btn { padding:0.15rem 0.3rem; color:var(--muted); border-radius:2px; }
    .ws { margin-bottom:0.15rem; }
    .ws-head {
      width:100%; display:flex; align-items:center; gap:0.4rem;
      color:#cfcfcf; padding:0.3rem 0.35rem; border-radius:2px;
    }
    .ws-head .chev { width:0.7rem; color:var(--muted); flex:none; }
    .ws-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; color:var(--lcd-ink); }
    .ws-kind { font-size:0.68rem; color:var(--muted); flex:none; text-transform:uppercase; letter-spacing:0.04em; }
    .chat {
      width:100%; display:flex; align-items:center; gap:0.4rem;
      padding:0.32rem 0.4rem 0.32rem 1.2rem; border-radius:2px; color:#c8c8d0;
    }
    .chat.active { background:var(--active); color:var(--lcd-ink); }
    .chat.active .chat-time { color:var(--lcd-dim); }
    .chat-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chat-time { font-size:0.68rem; color:var(--muted); flex:none; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    /* Rail activity: a chat with a live turn spins; one that finished while you
       were elsewhere stays highlighted until you click it. */
    .chat-state { width:0.75rem; height:0.75rem; flex:none; position:relative; }
    .chat-state .spin, .chat-state .bell { display:none; }
    .chat.running .chat-state .spin {
      display:block; width:0.7rem; height:0.7rem; border-radius:50%;
      border:2px solid rgba(120,255,160,0.22);
      border-top-color:var(--lcd-ink);
      animation:chat-spin 0.85s linear infinite;
    }
    .chat.done .chat-state .bell {
      display:block; width:0.45rem; height:0.45rem; margin:0.15rem;
      border-radius:50%; background:var(--amber);
      box-shadow:0 0 6px rgba(255,176,40,0.65);
      animation:chat-blip 1.8s ease-in-out infinite;
    }
    .chat.done { background:rgba(255,176,40,0.1); color:var(--amber); box-shadow:inset 2px 0 0 var(--amber); }
    .chat.done .chat-title { font-weight:700; }
    .chat.done .chat-time { color:var(--amber); }
    /* Waiting for permission: very noticeable amber/orange pulsing border + badge */
    .chat.perm-waiting {
      background:rgba(255,140,0,0.18); color:#ffcf6a;
      box-shadow:inset 3px 0 0 #ff8c00, 0 0 0 1px rgba(255,140,0,0.25);
      animation:perm-glow 1.6s ease-in-out infinite;
    }
    .chat.perm-waiting .chat-title { font-weight:700; }
    .chat.perm-waiting .chat-state .perm-badge {
      display:flex; align-items:center; justify-content:center;
      width:0.95rem; height:0.95rem; border-radius:2px;
      background:#ff8c00; color:#111; font-size:0.6rem; font-weight:900;
      line-height:1; animation:perm-pulse 1.2s ease-in-out infinite;
    }
    .chat-state .perm-badge { display:none; }
    @keyframes chat-spin { to { transform:rotate(360deg); } }
    @keyframes chat-blip { 0%, 100% { opacity:1; } 50% { opacity:0.35; } }
    @keyframes perm-pulse { 0%, 100% { opacity:1; transform:scale(1); } 50% { opacity:0.7; transform:scale(0.88); } }
    @keyframes perm-glow {
      0%, 100% { background:rgba(255,140,0,0.18); box-shadow:inset 3px 0 0 #ff8c00, 0 0 0 1px rgba(255,140,0,0.25); }
      50% { background:rgba(255,140,0,0.30); box-shadow:inset 3px 0 0 #ffa020, 0 0 8px rgba(255,140,0,0.45); }
    }
    /* Activity inside a collapsed group (or below the "More" cutoff) rolls up
       onto the workspace header so it is never invisible. */
    .ws-activity { flex:none; display:none; align-items:center; gap:0.3rem; font-size:0.68rem; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ws-activity.on { display:flex; }
    .ws-activity .run { color:var(--lcd-ink); }
    .ws-activity .run::before { content:"◴ "; }
    .ws-activity .fin { color:var(--amber); }
    .ws-activity .fin::before { content:"● "; }
    .ws-activity .perm { color:#ff8c00; animation:perm-pulse 1.2s ease-in-out infinite; }
    .ws-activity .perm::before { content:"⚠ "; }
    .ws-activity .run.off, .ws-activity .fin.off, .ws-activity .perm.off { display:none; }
    @media (prefers-reduced-motion: reduce) {
      .chat.running .chat-state .spin { animation:pulse 1.4s ease-in-out infinite; }
      .chat.done .chat-state .bell { animation:none; }
      .chat.perm-waiting { animation:none; }
      .chat.perm-waiting .chat-state .perm-badge { animation:none; }
      .ws-activity .perm { animation:none; }
    }
    .more { color:var(--muted); font-size:0.8rem; padding:0.2rem 0.45rem 0.35rem 1.35rem; }
    /* Right-click menu for a chat row. Fixed-positioned at the pointer and
       clamped to the viewport by positionContextMenu(). */
    .ctx-menu {
      position:fixed; z-index:60; min-width:9rem; padding:0.2rem;
      background:var(--panel, #1a1a1f); border:1px solid var(--line);
      border-radius:3px; box-shadow:0 6px 20px rgba(0,0,0,0.55);
      display:flex; flex-direction:column; gap:0.05rem;
    }
    .ctx-menu.hidden { display:none; }
    .ctx-menu button {
      width:100%; text-align:left; padding:0.35rem 0.6rem; border-radius:2px;
      color:#c8c8d0; font-size:0.85rem; background:none; border:none; cursor:pointer;
    }
    .ctx-menu button:hover, .ctx-menu button:focus { background:var(--active); color:var(--lcd-ink); outline:none; }
    .ctx-menu button.danger { color:#f0a0a0; }
    .ctx-menu button.danger:hover, .ctx-menu button.danger:focus { background:#4a1c1c; color:#ffd0d0; }
    .ctx-menu .ctx-label {
      padding:0.3rem 0.6rem 0.2rem; font-size:0.7rem; color:var(--muted);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:14rem;
    }
    .ctx-menu hr { border:none; border-top:1px solid var(--line); margin:0.15rem 0; }
    .empty { color:var(--muted); padding:1rem 0.7rem; font-size:0.85rem; }
    .rail-foot { padding:0.45rem 0.55rem 0.6rem; }
    .conn-toggle {
      width:100%; display:flex; align-items:center; gap:0.5rem;
      background:var(--lcd); color:var(--lcd-ink);
      font: 0.72rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:0.1em; text-transform:uppercase;
      padding:0.45rem 0.55rem;
      box-shadow: inset 1px 1px 3px #000, inset -1px -1px 0 #1a2a1c;
    }
    .conn-toggle:hover { background:#0b140c; }
    .dot { width:0.45rem; height:0.45rem; border-radius:50%; background:#3a3a22; flex:none; box-shadow: inset 0 0 2px #000; }
    .dot.ok { background:var(--lcd-ink); box-shadow:0 0 6px var(--lcd-ink); }
    #settings { margin-top:0.45rem; }
    #settings.hidden { display:none; }
    #settings label { display:block; font-size:0.68rem; color:var(--amber); letter-spacing:0.08em; text-transform:uppercase; margin-top:0.45rem; }
    #settings input, #settings textarea {
      width:100%; margin-top:0.2rem; padding:0.35rem 0.45rem;
    }
    .mic { width:100%; margin-top:0.5rem; color:var(--ink); font-size:0.75rem; text-align:center; }
    #stage { flex:1; min-width:0; display:flex; flex-direction:column; }
    header.chat-bar { padding:0.45rem 0.55rem 0.35rem; }
    header.chat-bar .lcd {
      display:flex; flex-direction:column; gap:0.4rem;
      background:var(--lcd); padding:0.45rem 0.75rem 0.5rem;
      box-shadow: inset 2px 2px 5px #000, inset -1px -1px 0 #1a2a1c;
      min-height:2.6rem;
    }
    .lcd-top {
      display:flex; gap:1rem; align-items:center; justify-content:space-between;
      min-width:0;
    }
    .lcd-copy { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.12rem; }
    header.chat-bar h2 {
      font: 0.95rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin:0 -0.15rem; font-weight:650; color:var(--lcd-ink);
      text-shadow:0 0 8px rgba(120,255,160,0.3);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      min-width:0;
      /* Click the title to rename; #chat-title-edit swaps in place. */
      cursor:text; border-radius:2px; padding:0 0.15rem;
    }
    header.chat-bar h2:hover, header.chat-bar h2:focus-visible {
      background:rgba(120,255,160,0.08); outline:none;
    }
    header.chat-bar h2.hidden, #chat-title-edit.hidden { display:none; }
    #chat-title-edit {
      width:100%; min-width:0; padding:0.1rem 0.25rem;
      font: 0.95rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight:650;
    }
    .lcd-where {
      color:var(--lcd-dim);
      font: 0.72rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      padding:0 0.15rem;
    }
    .lcd-where:empty { display:none; }
    #status {
      color:var(--amber); font: 0.75rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none; max-width:40%;
    }
    #status:empty { display:none; }
    .ctx-meter {
      display:flex; align-items:center; gap:0.55rem;
      padding:0.05rem 0.15rem 0.1rem;
    }
    .ctx-meter.hidden { display:none; }
    .ctx-lab {
      color:var(--amber); font: 0.68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:0.12em; flex:none;
    }
    .ctx-track {
      flex:1; height:0.55rem; background:#041204;
      box-shadow: inset 1px 1px 3px #000, inset -1px -1px 0 #1a2a1c;
      overflow:hidden;
    }
    .ctx-fill {
      height:100%; width:0%;
      background: repeating-linear-gradient(90deg, #78ffa0 0 5px, #041204 5px 7px);
      box-shadow: 0 0 6px rgba(120,255,160,0.35);
    }
    .ctx-nums {
      color:var(--lcd-ink);
      font: 0.68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      flex:none; min-width:7.5rem; text-align:right;
    }
    #log {
      flex:1; overflow-y:auto; margin:0 0.45rem; padding:0.7rem 0.85rem;
      background:var(--lcd);
      box-shadow: inset 2px 2px 6px #000, inset -1px -1px 0 #1a2a1c;
    }
    .msg { margin:0.45rem 0; padding:0.55rem 0.65rem; border-radius:2px; background:#0c120c; }
    .msg-body { white-space:pre-wrap; }
    .msg.user { border-left:3px solid var(--accent); }
    .msg-dup-count { color:var(--lcd-dim); font-size:0.75rem; margin-left:0.4rem; }
    .msg.assistant { border-left:3px solid var(--amber); }
    .msg.tool { border-left:3px solid #888; color:#bbb; font-size:0.85rem; }
    .placeholder { color:var(--lcd-dim); padding:3rem 1rem; text-align:center; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #composer textarea {
      width:100%; min-height:3.2rem; resize:vertical; padding:0.55rem 0.65rem; color:var(--lcd-ink);
    }
    #dock { padding:0 0.45rem 0.35rem; }
    #followups { padding:0.5rem 0.55rem 0; display:flex; flex-direction:column; gap:0.3rem; }
    #followups.hidden { display:none; }
    .q-item {
      display:flex; align-items:center; gap:0.4rem;
      background:#0c120c; border-radius:2px; padding:0.35rem 0.55rem;
      border-left:3px solid var(--amber);
    }
    .q-lab { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-size:0.85rem; color:#ddd; }
    .q-item button { color:var(--muted); padding:0.1rem 0.4rem; }
    #composer { display:flex; flex-direction:column; gap:0.45rem; padding:0.55rem 0.55rem 0.25rem; border-top:0; }
    .composer-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; }
    .composer-btns { display:flex; flex-wrap:wrap; gap:0.35rem; margin-left:auto; }
    #model {
      flex:1 1 11rem; max-width:16rem; min-width:10rem;
      font-size:0.8rem; padding:0.4rem 0.5rem; cursor:pointer; color:var(--lcd-ink);
    }
    #model option { background:#111; color:var(--lcd-ink); }
    #model option:disabled { color:#666; }
    #send {
      width:auto; color:var(--lcd-ink); font-weight:700; letter-spacing:0.08em;
      text-transform:uppercase; padding:0.45rem 0.9rem; min-width:5.2rem; text-align:center;
    }
    #send:hover { filter:brightness(1.08); }
    #send.stop {
      background: linear-gradient(180deg, #5a3030 0%, #3a2020 48%, #2a1818 100%);
      color:#f2c0c0;
    }
    #send.stop:hover { filter:none; }
    .ghost {
      color:var(--ink); font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
      font-size:0.72rem; padding:0.4rem 0.7rem; white-space:nowrap; min-width:6.6rem; text-align:center;
    }
    .ghost:hover { filter:brightness(1.08); background: linear-gradient(180deg, #44444e 0%, #32323a 48%, #222228 100%); }
    .ghost:disabled { opacity:0.4; cursor:default; }
    .ghost.hidden, #continue.hidden, #queue-btn.hidden, #inject.hidden { display:none; }
    #composer-hint { padding:0 0.55rem 0.55rem; font-size:0.72rem; color:var(--lcd-dim); }
    #composer-hint.hidden { display:none; padding:0; }
    .msg.injected { border-left-color:#8aa0c8; }
    .msg.ask { border-left-color:#8aa0c8; }
    .msg.permission { border-left-color:#d9a441; }
    .msg.permission .perm-title { font-weight:600; }
    .msg.permission .perm-summary {
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.82rem;
      background:var(--lcd); border-radius:2px; padding:0.35rem 0.5rem; margin:0.35rem 0;
      white-space:pre-wrap; word-break:break-word;
    }
    .msg.permission .perm-reason { color:var(--muted); font-size:0.8rem; }
    .msg.permission .perm-outcome { margin-top:0.35rem; font-size:0.85rem; color:#cfcfcf; }
    .msg.permission.resolved { opacity:0.85; }
    .msg.permission .perm-actions button { border:1px solid var(--line); }
    .msg.permission .perm-actions button.allow { color:#8fd18f; }
    .msg.permission .perm-actions button.deny { color:#e08a8a; }
    .msg-actions { display:flex; gap:0.25rem; margin-top:0.4rem; }
    .msg-actions button {
      font-size:0.75rem; color:var(--muted); padding:0.12rem 0.45rem; border-radius:2px;
    }
    .msg-actions button:hover { color:var(--ink); }
    .msg-actions .restore-files {
      display:flex; align-items:center; gap:0.25rem; font-size:0.75rem; color:var(--muted); cursor:pointer;
    }
    .msg.checkpoint { border-left-color:#8ac8a0; }
    .btn-new.secondary {
      color:var(--ink); font-weight:700;
    }
    .btn-new.secondary:hover { filter:brightness(1.08); }
    #ws-modal.hidden { display:none; }
    #ws-modal {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      display:flex; align-items:center; justify-content:center; z-index:40;
    }
    #ws-modal .sheet {
      width:min(34rem, 94vw); max-height:82vh; overflow:hidden;
      background:var(--chrome);
      box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-lo), 0 8px 24px #000;
      display:flex; flex-direction:column;
    }
    #ws-modal header {
      padding:0.85rem 1rem 0.55rem; border-bottom:1px solid var(--line);
    }
    #ws-modal header h3 { margin:0; font-size:0.95rem; font-weight:650; }
    #ws-modal header p { margin:0.35rem 0 0; color:var(--muted); font-size:0.8rem; }
    #ws-crumbs {
      display:flex; flex-wrap:wrap; gap:0.2rem; align-items:center;
      padding:0.55rem 1rem; border-bottom:1px solid var(--line); font-size:0.8rem;
    }
    #ws-crumbs button { padding:0.15rem 0.35rem; color:#cfcfcf; }
    #ws-crumbs .sep { color:var(--muted); }
    #ws-host { padding:0 1rem 0.35rem; color:var(--muted); font-size:0.75rem; word-break:break-all; }
    #ws-dirs { flex:1; overflow-y:auto; padding:0.4rem 0.55rem 0.6rem; min-height:12rem; }
    #ws-dirs .dir {
      width:100%; display:flex; align-items:center; gap:0.45rem;
      padding:0.42rem 0.5rem; border-radius:2px;
    }
    #ws-dirs .dir .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #ws-dirs .empty { padding:1.5rem 0.5rem; }
    #ws-modal footer {
      display:flex; flex-wrap:wrap; gap:0.45rem; align-items:center;
      padding:0.7rem 1rem 0.9rem; border-top:1px solid var(--line);
    }
    #ws-modal footer input {
      padding:0.35rem 0.45rem;
    }
    #ws-new-name { flex:1; min-width:8rem; }
    #ws-modal .grow { flex:1; }
    #ws-use { color:var(--lcd-ink); font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
    .msg.working, .msg.stopped {
      color:var(--muted); font-style:italic; background:transparent; border-left-color:#555;
    }
    .msg.working .msg-role, .msg.stopped .msg-role { display:none; }
    .msg-role {
      font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted);
      margin-bottom:0.25rem; font-weight:600;
    }
    .msg.user .msg-role { color:var(--accent); }
    .msg.assistant .msg-role { color:var(--amber); }

    /* Markdown bodies */
    .msg-body.md { white-space:normal; overflow-wrap:anywhere; }
    .md > :first-child { margin-top:0; }
    .md > :last-child { margin-bottom:0; }
    .md p, .md ul, .md ol, .md blockquote, .md table { margin:0.45rem 0; }
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:0.8rem 0 0.35rem; line-height:1.25; font-weight:650; }
    .md h1 { font-size:1.25rem; } .md h2 { font-size:1.12rem; } .md h3 { font-size:1.02rem; }
    .md h4, .md h5, .md h6 { font-size:0.95rem; }
    .md ul, .md ol { padding-left:1.4rem; }
    .md li + li { margin-top:0.15rem; }
    .md a { color:#9dc3ff; }
    .md code {
      font: 0.86em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background:var(--lcd); border:1px solid var(--line); border-radius:2px; padding:0.05rem 0.3rem;
    }
    .md pre { margin:0; padding:0.6rem 0.7rem; overflow-x:auto; background:var(--lcd); }
    .md pre code { background:transparent; border:0; padding:0; font-size:0.82rem; white-space:pre; }
    .codeblock { margin:0.5rem 0; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--lcd); }
    .code-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.15rem 0.35rem 0.15rem 0.7rem; background:#121812; border-bottom:1px solid var(--line);
      font-size:0.7rem; color:var(--muted);
    }
    .copy-btn { font-size:0.7rem; padding:0.1rem 0.45rem; color:var(--muted); border-radius:2px; }
    .copy-btn:hover { color:var(--ink); }
    .md blockquote { border-left:3px solid #444; margin-left:0; padding:0.1rem 0.8rem; color:#bbb; }
    .md table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; }
    .md th, .md td { border:1px solid var(--line); padding:0.25rem 0.55rem; text-align:left; }
    .md th { background:#121812; }
    .md img { max-width:100%; border-radius:2px; }
    .md hr { border:0; border-top:1px solid var(--line); margin:0.8rem 0; }
    .md input[type="checkbox"] { margin-right:0.35rem; }

    /* Tool cards */
    .msg.card { padding:0; overflow:hidden; color:#ccc; font-size:0.85rem; }
    .msg.card.warned { border-left-color:#d9a441; }
    .msg.card.subagent { border-left-color:#8aa0c8; }
    .card-head {
      width:100%; display:flex; align-items:center; gap:0.5rem;
      padding:0.5rem 0.7rem; border-radius:0; color:#ddd; font-size:0.85rem;
    }
    .card-head:hover { background:var(--hover); }
    .tool-icon { flex:none; width:1.2rem; text-align:center; font-size:0.95rem; }
    .tool-name { flex:none; font-weight:650; color:#eee; }
    .tool-summary {
      flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      color:#aaa; font: 0.8rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .card-head .chev { flex:none; color:var(--muted); width:0.8rem; text-align:center; }
    .chip {
      flex:none; font-size:0.66rem; letter-spacing:0.04em; text-transform:uppercase; font-weight:650;
      padding:0.08rem 0.4rem; border-radius:2px; border:1px solid transparent;
    }
    .chip.running { color:#9dc3ff; border-color:#33507a; background:#16233a; animation:pulse 1.4s ease-in-out infinite; }
    .chip.waiting { color:#c9b3ff; border-color:#5a4a86; background:#241f3a; }
    .chip.done { color:#a9d6b4; border-color:#3a5c42; background:#182a1d; }
    .chip.error { color:#ff9f9f; border-color:#7a3333; background:#3a1616; }
    .chip.blocked { color:#f2c069; border-color:#7a5a1e; background:#3a2c10; }
    .chip.stopped { color:#bbb; border-color:#444; background:#222; }
    @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.55; } }
    .card-body { border-top:1px solid var(--line); padding:0.55rem 0.75rem 0.65rem; display:flex; flex-direction:column; gap:0.5rem; }
    .card-body.hidden { display:none; }
    .card-body > div:empty, .card-body > pre:empty { display:none; }
    .card-input, .tool-output {
      margin:0; font: 0.8rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space:pre-wrap; overflow-wrap:anywhere; background:var(--lcd); border:1px solid var(--line);
      border-radius:2px; padding:0.5rem 0.6rem; max-height:26rem; overflow:auto; color:#d6d6d6;
    }
    .card-out { display:flex; flex-direction:column; gap:0.4rem; }
    .card-out img.tool-image { max-width:min(100%, 40rem); border-radius:2px; border:1px solid var(--line); }
    .card-perm { font-size:0.78rem; color:var(--muted); }
    .card-perm[data-behavior="deny"], .card-perm[data-behavior="ask"] { color:#f2c069; }
    .card-warn {
      font-size:0.8rem; color:#f2c069; background:#3a2c10; border:1px solid #7a5a1e;
      border-radius:2px; padding:0.35rem 0.55rem;
    }
    .card-persist { font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
    .card-persist code { font-size:0.78rem; color:#ccc; background:var(--lcd); padding:0.05rem 0.3rem; border-radius:2px; }
    .card-note { font-size:0.78rem; color:var(--muted); }
    .out-more { font-size:0.75rem; color:var(--muted); font-style:italic; }
    .msg.tool.error { border-left-color:#c05050; color:#f0b0b0; }
    .msg.tool.note { color:var(--muted); font-size:0.8rem; }
    .msg.event { padding:0.35rem 0.75rem; }
    .msg.event summary { cursor:pointer; color:var(--muted); font-size:0.8rem; }
    .msg.event pre { font-size:0.78rem; white-space:pre-wrap; overflow-wrap:anywhere; margin:0.35rem 0 0; color:#bbb; }

    /* Diffs */
    .diff { border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--lcd); }
    .diff-head {
      display:flex; align-items:center; gap:0.6rem; padding:0.25rem 0.6rem;
      background:#121812; border-bottom:1px solid var(--line); font-size:0.75rem; color:#bbb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .diff-head .add { color:#8fd19e; } .diff-head .del { color:#f19a9a; }
    .diff-body { margin:0; padding:0.3rem 0; max-height:26rem; overflow:auto; font: 0.78rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dl { display:flex; white-space:pre-wrap; overflow-wrap:anywhere; padding:0 0.6rem 0 0; }
    .dl .dm { flex:none; width:1.4rem; text-align:center; color:var(--muted); user-select:none; }
    .dl.add { background:rgba(70, 160, 90, 0.18); color:#c9f0d0; }
    .dl.add .dm { color:#8fd19e; }
    .dl.del { background:rgba(200, 70, 70, 0.18); color:#f5c9c9; }
    .dl.del .dm { color:#f19a9a; }
    .dl.ctx { color:#9a9a9a; }
    .dl.more { color:var(--muted); font-style:italic; padding-left:1.4rem; }

    /* Ask-user prompt */
    .msg.ask { border-left-color:#8aa0c8; background:#1a1d24; }
    .msg.ask .msg-role { color:#8aa0c8; }
    .ask-hint { margin-top:0.45rem; font-size:0.75rem; color:var(--muted); }
    .msg.ask.answered .ask-hint { display:none; }

    /* Subagent card */
    .sub-task { white-space:pre-wrap; overflow-wrap:anywhere; color:#ddd; }
    .sub-meta { display:flex; align-items:center; gap:0.6rem; font-size:0.75rem; color:var(--muted); flex-wrap:wrap; }
    .sub-open { font-size:0.75rem; padding:0.1rem 0.45rem; color:#9dc3ff; border:1px solid #33507a; border-radius:2px; }
    .card-nested { display:flex; flex-direction:column; gap:0.35rem; }
    .card-nested .msg { margin:0; }
    .card-nested:empty { display:none; }

    /* Todo checklist */
    .todo-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.2rem; }
    .todo-item { display:flex; align-items:flex-start; gap:0.45rem; font-size:0.85rem; color:#ddd; }
    .todo-item .tmark { flex:none; width:1.1rem; text-align:center; color:var(--muted); font-family: ui-monospace, monospace; }
    .todo-item.completed { color:var(--muted); text-decoration:line-through; }
    .todo-item.completed .tmark { color:#a9d6b4; text-decoration:none; }
    .todo-item.in_progress .tmark { color:#9dc3ff; }
    .todo-item.in_progress { color:#fff; }
    .todo-item.cancelled { color:#777; text-decoration:line-through; }
    #todo-panel { margin:0.45rem 0.55rem 0; background:#0c120c; border-radius:2px; border-left:3px solid var(--amber); }
    #todo-panel.hidden { display:none; }
    #todo-head { width:100%; display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:#ddd; padding:0.35rem 0.6rem; }
    #todo-head .tcount { color:var(--muted); font-weight:500; }
    #todo-head .chev { margin-left:auto; color:var(--muted); }
    #todo-body { padding:0.1rem 0.75rem 0.55rem; max-height:11rem; overflow-y:auto; }
    #todo-panel.collapsed #todo-body { display:none; }
  </style>
</head>
<body>
  <aside id="rail">
    <div class="brand"><h1>Orbweaver</h1><span class="ver" id="app-ver"></span></div>
    <div class="rail-actions">
      <button type="button" class="btn-new" id="newsession">+ New chat</button>
      <button type="button" class="btn-new secondary" id="newworkspace">+ New workspace</button>
      <input id="search" class="search" placeholder="Search chats" autocomplete="off">
    </div>
    <div class="rail-list" id="session-list">
      <div class="empty">Paste a JWT to load chats.</div>
    </div>
    <div class="rail-foot">
      <button type="button" class="conn-toggle" id="settings-toggle">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-label">Offline</span>
      </button>
      <div id="settings" class="hidden">
        <label>Gateway</label>
        <input id="base" value="">
        <label>JWT (from `python -m orbweaver.cli mint`)</label>
        <input id="token" placeholder="paste token from gateway host">
        <label>Workspace URI</label>
        <input id="wuri" value="workspace:default">
        <label>Workspace kind</label>
        <input id="wkind" value="local">
        <label>Session id</label>
        <input id="sid">
        <button type="button" class="mic" id="mic">Record 4s for STT</button>
      </div>
    </div>
  </aside>
  <div id="ws-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="sheet">
      <header>
        <h3 id="ws-modal-title">Choose workspace folder</h3>
        <p>Folders under WORKSPACE_ROOT. Sessions store a portable URI, not an absolute path.</p>
      </header>
      <div id="ws-crumbs"></div>
      <div id="ws-host"></div>
      <div id="ws-dirs"></div>
      <footer>
        <input id="ws-new-name" placeholder="New folder name">
        <button type="button" class="ghost" id="ws-mkdir">Create</button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="ws-cancel">Cancel</button>
        <button type="button" id="ws-use">Use this folder</button>
      </footer>
    </div>
  </div>
  <div id="stage">
    <header class="chat-bar">
      <div class="lcd">
        <div class="lcd-top">
          <div class="lcd-copy">
            <h2 id="chat-title" tabindex="0" role="button" title="Click to rename this chat">New chat</h2>
            <input id="chat-title-edit" class="hidden" aria-label="Chat title" maxlength="80" autocomplete="off">
            <div id="chat-where" class="lcd-where"></div>
          </div>
          <span id="status"></span>
        </div>
        <div id="ctx-meter" class="ctx-meter hidden" aria-label="Context window">
          <span class="ctx-lab">CTX</span>
          <div class="ctx-track" aria-hidden="true"><div id="ctx-fill" class="ctx-fill"></div></div>
          <span id="ctx-nums" class="ctx-nums"></span>
        </div>
      </div>
    </header>
    <div id="log"></div>
    <div id="dock">
      <div id="todo-panel" class="hidden">
        <button type="button" id="todo-head"><span>Tasks</span><span class="tcount" id="todo-count"></span><span class="chev">▾</span></button>
        <div id="todo-body"></div>
      </div>
      <div id="followups" class="hidden"></div>
      <div id="composer">
        <textarea id="text" placeholder="Message (Shift+Enter for newline)"></textarea>
        <div class="composer-toolbar">
          <select id="model" title="Model for this chat (default is Auto)" aria-label="Model">
            <option value="">default model</option>
          </select>
          <div class="composer-btns">
            <button type="button" id="queue-btn" class="ghost hidden" title="Run after this turn finishes">Queue</button>
            <button type="button" id="inject" class="ghost hidden" title="Fold into the live turn (Ctrl+Enter)">Add to turn</button>
            <button type="button" id="continue" class="ghost hidden" title="Resume the stopped turn">Continue</button>
            <button type="button" id="send">Send</button>
          </div>
        </div>
      </div>
      <div id="composer-hint" class="hidden"></div>
    </div>
  </div>
  <div id="chat-menu" class="ctx-menu hidden" role="menu" aria-hidden="true">
    <div class="ctx-label" id="chat-menu-label"></div>
    <button type="button" id="chat-menu-rename" role="menuitem">Rename</button>
    <hr>
    <button type="button" id="chat-menu-delete" class="danger" role="menuitem">Delete</button>
  </div>
  <!-- Vendored, pinned; see web/vendor/README.md. Served by the /ui static mount. -->
  <script src="/ui/vendor/marked.min.js"></script>
  <script src="/ui/vendor/purify.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const LS = {
      jwt: "orbweaver.jwt", sid: "orbweaver.sid", wuri: "orbweaver.wuri",
      wkind: "orbweaver.wkind", collapsed: "orbweaver.collapsedWs", expanded: "orbweaver.expandedWs",
      done: "orbweaver.doneSids", seen: "orbweaver.seenAt", pollMs: "orbweaver.pollMs"
    };
    let sessions = [];
    // One live turn per session. A turn in chat A must not block sending in chat B.
    const flights = new Map();
    function flightFor(sid) { return (sid && flights.get(sid)) || null; }
    function currentFlight() { return flightFor(currentSid()); }
    function dropEl(el) { if (el && el.parentNode) el.remove(); }
    function finishWorking(sid, workingEl) {
      const flight = flightFor(sid);
      dropEl(workingEl);
      if (flight) dropEl(flight.workingEl);
    }
    function clearFlight(sid, flight) {
      if (sid && flights.get(sid) === flight) flights.delete(sid);
      noteFlightChange();
    }
    let logSid = "";
    let historyGen = 0;
    let stoppedSids = new Set();
    let waitingAskSids = new Set();
    let waitingPermSids = new Set();  // sessions with an unresolved permission_request
    const followupQueues = new Map();
    let collapsed = new Set(JSON.parse(localStorage.getItem(LS.collapsed) || "[]"));
    let expandedExtra = new Set(JSON.parse(localStorage.getItem(LS.expanded) || "[]"));

    // Rail activity. `runningSids` is what the rail animates: the union of this
    // tab's flights and the gateway's view (`running` on /v1/sessions), so a
    // turn started from Telegram or another tab spins here too. When a running
    // chat you are not looking at goes idle it lands in `doneSids` and stays
    // highlighted until you click it.
    //
    // A running→idle transition is not enough on its own: if the tab was hidden
    // or closed for the whole turn, no poll ever saw it running. `seenAt` is the
    // watermark (last_event_at at the moment you were last looking at the chat),
    // so new events in a chat you are not on also light it up.
    let gatewayRunning = new Set();
    let runningSids = new Set();
    let doneSids = new Set(JSON.parse(localStorage.getItem(LS.done) || "[]"));
    let seenAt = new Map(JSON.parse(localStorage.getItem(LS.seen) || "[]"));
    function persistDone() {
      try { localStorage.setItem(LS.done, JSON.stringify([...doneSids])); } catch (e) {}
    }
    function persistSeen() {
      try { localStorage.setItem(LS.seen, JSON.stringify([...seenAt])); } catch (e) {}
    }
    // Mark this chat read: drop its highlight and move the watermark forward.
    function markSeen(sid) {
      if (!sid) return false;
      const row = sessions.find((s) => s.id === sid);
      const stamp = row ? String(row.last_event_at || row.created_at || "") : "";
      if (seenAt.get(sid) !== stamp) { seenAt.set(sid, stamp); persistSeen(); }
      return clearDone(sid);
    }
    function clearDone(sid) {
      if (!sid || !doneSids.has(sid)) return false;
      doneSids.delete(sid);
      persistDone();
      return true;
    }
    // Recompute running/done from `gatewayRunning` plus this tab's flights.
    // Returns true when anything moved, so callers can repaint the rail.
    function trackActivity() {
      const live = new Set(gatewayRunning);
      for (const sid of flights.keys()) live.add(sid);
      let changed = false;
      for (const sid of runningSids) {
        if (live.has(sid)) continue;
        // A turn that finished in the chat you are watching needs no bell.
        if (sid !== currentSid()) {
          doneSids.add(sid);
          persistDone();
        }
        changed = true;
      }
      for (const sid of live) {
        if (!runningSids.has(sid)) changed = true;
        if (doneSids.delete(sid)) { persistDone(); changed = true; }
      }
      runningSids = live;
      return changed;
    }
    // New events in a chat you have opened before but are not on now.
    // Sessions with no watermark are skipped so a fresh browser does not
    // light up every chat in the rail.
    function trackUnseen() {
      let changed = false;
      for (const s of sessions) {
        const stamp = String(s.last_event_at || s.created_at || "");
        if (s.id === currentSid()) {
          if (seenAt.get(s.id) !== stamp) { seenAt.set(s.id, stamp); persistSeen(); }
          continue;
        }
        const seen = seenAt.get(s.id);
        if (seen === undefined || runningSids.has(s.id)) continue;
        if (stamp && stamp > seen && !doneSids.has(s.id)) {
          doneSids.add(s.id);
          persistDone();
          changed = true;
        }
      }
      return changed;
    }
    // The gateway's snapshot of live turns, from the latest /v1/sessions.
    function setGatewayRunning(ids) {
      gatewayRunning = new Set(ids);
      const moved = trackActivity();
      return trackUnseen() || moved;
    }
    // Drop done marks and watermarks for sessions the gateway no longer lists,
    // so a deleted chat cannot keep a highlight in localStorage forever.
    function pruneDone(known) {
      const live = new Set(known);
      let changed = false;
      for (const sid of [...doneSids]) {
        if (live.has(sid)) continue;
        doneSids.delete(sid);
        changed = true;
      }
      if (changed) persistDone();
      let seenChanged = false;
      for (const sid of [...seenAt.keys()]) {
        if (live.has(sid)) continue;
        seenAt.delete(sid);
        seenChanged = true;
      }
      if (seenChanged) persistSeen();
    }
    // A turn this tab starts or finishes: reflect it without waiting for a poll.
    function noteFlightChange() {
      if (trackActivity()) paintActivity();
    }
    function setFlight(sid, flight) {
      flights.set(sid, flight);
      noteFlightChange();
    }
    $("base").value = location.origin;
    // Model picker (#137). "" = the channel default (ORBWEAVER_WEB_MODEL, else
    // ORBWEAVER_MODEL); anything else is stored on the session by the gateway.
    let modelDefaults = {};
    let modelCatalog = [];
    let modelsLoaded = false;
    function defaultWebModel() {
      return String(modelDefaults.web || modelDefaults.fallback || "");
    }
    function pickedModel() { return $("model").value.trim(); }
    function modelLabelFor(id) {
      if (id === "auto") {
        const row = modelCatalog.find((m) => m && m.id === "auto");
        return (row && row.label) ? row.label : "Auto";
      }
      const row = modelCatalog.find((m) => m && m.id === id);
      return (row && row.label) ? row.label : id;
    }
    function optionLabel(m) {
      const label = (m && m.label) ? m.label : (m && m.id ? m.id : "");
      return m && m.available === false ? label + " (no key)" : label;
    }
    function paintModelPicker() {
      const sel = $("model");
      const cur = currentSession();
      const want = cur ? String(cur.model || "") : (sel.dataset.pending || "");
      sel.replaceChildren();
      const def = document.createElement("option");
      def.value = "";
      const fallback = defaultWebModel();
      def.textContent = fallback ? "Default (" + modelLabelFor(fallback) + ")" : "Default model";
      sel.appendChild(def);
      const ids = new Set();
      for (const m of modelCatalog) {
        if (!m || !m.id || ids.has(m.id)) continue;
        ids.add(m.id);
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = optionLabel(m);
        o.title = m.id;
        o.disabled = m.available === false;
        sel.appendChild(o);
      }
      if (want && !ids.has(want)) {
        const o = document.createElement("option");
        o.value = want;
        o.textContent = want;
        sel.appendChild(o);
      }
      sel.value = want;
      if (sel.value !== want) sel.value = "";
    }
    async function loadModels() {
      if (!$("token").value.trim()) return;
      try {
        const r = await api("/v1/models");
        modelCatalog = r.models || [];
        modelDefaults = r.defaults || modelDefaults;
        modelsLoaded = true;
      } catch (e) { /* header keeps the /health default */ }
      paintModelPicker();
    }
    async function pingVersion() {
      try {
        const r = await fetch($("base").value.replace(/\/$/, "") + "/health");
        const j = await r.json();
        $("app-ver").textContent = j.version ? "v" + j.version : "";
        const llm = j.llm || {};
        if (llm.defaults) modelDefaults = llm.defaults;
        else if (llm.model) modelDefaults = { web: String(llm.model), fallback: String(llm.model) };
        paintModelPicker();
      } catch {
        $("app-ver").textContent = "";
      }
    }
    pingVersion();
    const savedTok = localStorage.getItem(LS.jwt);
    if (savedTok) $("token").value = savedTok;
    const savedSid = localStorage.getItem(LS.sid);
    if (savedSid) $("sid").value = savedSid;
    const savedWuri = localStorage.getItem(LS.wuri);
    if (savedWuri) $("wuri").value = savedWuri;
    const savedWkind = localStorage.getItem(LS.wkind);
    if (savedWkind && savedWkind !== "docker") $("wkind").value = savedWkind;
    else $("wkind").value = "local";
    function sidFromHash() {
      return (location.hash.match(/^#\/s\/([0-9a-f-]{36})$/i) || [])[1] || "";
    }
    const hashSid = sidFromHash();
    if (hashSid) $("sid").value = hashSid;
    if (!$("token").value.trim()) $("settings").classList.remove("hidden");

    function persistSid() {
      const sid = $("sid").value.trim();
      if (sid) localStorage.setItem(LS.sid, sid);
      else localStorage.removeItem(LS.sid);
    }
    function persistWorkspace() {
      if ($("wkind").value.trim() === "docker") $("wkind").value = "local";
      localStorage.setItem(LS.wuri, $("wuri").value.trim());
      localStorage.setItem(LS.wkind, $("wkind").value.trim() || "local");
    }
    function persistCollapsed() {
      localStorage.setItem(LS.collapsed, JSON.stringify([...collapsed]));
      localStorage.setItem(LS.expanded, JSON.stringify([...expandedExtra]));
    }
    $("token").addEventListener("input", () => {
      localStorage.setItem(LS.jwt, $("token").value.trim());
      modelsLoaded = false;
      refreshSessions();
    });
    $("model").addEventListener("change", async () => {
      const model = pickedModel();
      const sid = currentSid();
      if (!sid) { $("model").dataset.pending = model; return; }
      delete $("model").dataset.pending;
      try {
        await api("/v1/sessions/" + sid, { method:"PATCH", body: JSON.stringify({ model }) });
        const cur = currentSession();
        if (cur) cur.model = model;
      } catch (e) { $("status").textContent = String(e); }
    });
    $("base").addEventListener("change", pingVersion);
    $("wuri").addEventListener("input", persistWorkspace);
    $("wkind").addEventListener("input", persistWorkspace);
    $("sid").addEventListener("input", persistSid);
    $("sid").addEventListener("change", () => { persistSid(); loadHistory(); refreshSessions(); });
    window.addEventListener("beforeunload", persistSid);
    $("settings-toggle").onclick = () => $("settings").classList.toggle("hidden");
    $("search").addEventListener("input", paintSessions);

    // Autoscroll: pauses when the user scrolls up; resumes when they return to the bottom.
    let _userScrolled = false;
    function _initAutoscroll() {
      const log = $("log");
      log.addEventListener("scroll", () => {
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        _userScrolled = !atBottom;
      }, { passive: true });
    }
    function _scrollToBottom() {
      if (_userScrolled) return;
      const log = $("log");
      log.scrollTop = log.scrollHeight;
    }
    function _resetAutoscroll() {
      _userScrolled = false;
      _scrollToBottom();
    }

    // ------------------------------------------------------------------
    // Rendering layer. renderEvent(ev) is the single entry point for both
    // history backfill and live WebSocket events; it dedupes by seq so a
    // reconnect/backfill that replays an event does not double-render.
    // ------------------------------------------------------------------
    const renderedSeqs = new Set();
    const toolCards = new Map();      // tool_use_id -> card
    const subagentCards = new Map();  // child_session_id -> card
    const askBlocks = new Map();      // tool_use_id -> ask_user prompt element
    let lastUserText = "";
    let userTurnConcluded = false;
    let currentTodos = [];
    let _renderTarget = null;         // when set, new nodes go here (nested subagent events)
    const OUTPUT_CAP = 20000;
    const DIFF_MAX_LINES = 400;
    const ROLE_LABEL = { user: "You", assistant: "Orbweaver", tool: "Tool" };
    const TOOL_ICONS = {
      Read: "\u{1F4C4}", Write: "\u270F\uFE0F", StrReplace: "\u270F\uFE0F", ProposePatch: "\u270F\uFE0F",
      NotebookEdit: "\u{1F4D3}", Delete: "\u{1F5D1}\uFE0F", Bash: "\u2328\uFE0F", Glob: "\u{1F50D}",
      Grep: "\u{1F50D}", CodeSearch: "\u{1F50D}", ReadLints: "\u{1F9F9}", WebFetch: "\u{1F310}",
      WebSearch: "\u{1F310}", Browser: "\u{1F310}", AskUser: "\u2753", TodoWrite: "\u2611\uFE0F",
      SpawnSubagent: "\u{1F9F5}", GenerateImage: "\u{1F5BC}\uFE0F", SendPhoto: "\u{1F5BC}\uFE0F",
      MemorySearch: "\u{1F9E0}", MemoryGraph: "\u{1F9E0}", MemoryRemember: "\u{1F9E0}",
      ScheduleTask: "\u23F0"
    };
    const mdReady = !!(window.marked && window.DOMPurify);
    if (mdReady) window.marked.use({ gfm: true, breaks: true });

    function toolIcon(name) {
      if (TOOL_ICONS[name]) return TOOL_ICONS[name];
      if (String(name || "").startsWith("mcp_")) return "\u{1F50C}";
      return "\u{1F527}";
    }
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function appendToLog(node) {
      if (_renderTarget && _renderTarget.isConnected) {
        _renderTarget.appendChild(node);
      } else {
        const log = $("log");
        const working = log.querySelector(":scope > .msg.working");
        if (working) log.insertBefore(node, working);
        else log.appendChild(node);
      }
      _scrollToBottom();
    }
    function resetLog() {
      $("log").replaceChildren();
      renderedSeqs.clear();
      toolCards.clear();
      subagentCards.clear();
      askBlocks.clear();
      _renderTarget = null;
      logSid = "";
      lastUserText = "";
      userTurnConcluded = false;
      setTodos([]);
    }
    function copyText(text, btn) {
      const flash = () => {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = old; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(flash, () => {});
        return;
      }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        flash();
      } catch (e) {}
    }
    function decorateCodeBlock(pre) {
      const wrap = el("div", "codeblock");
      const bar = el("div", "code-bar");
      const code = pre.querySelector("code");
      const langCls = code ? [...code.classList].find((c) => c.startsWith("language-")) : null;
      bar.appendChild(el("span", "code-lang", langCls ? langCls.slice(9) : ""));
      const copy = el("button", "copy-btn", "Copy");
      copy.type = "button";
      copy.title = "Copy code";
      copy.onclick = (e) => { e.stopPropagation(); copyText(pre.textContent, copy); };
      bar.appendChild(copy);
      pre.replaceWith(wrap);
      wrap.append(bar, pre);
    }
    function renderMarkdown(container, text) {
      container.replaceChildren();
      const src = text == null ? "" : String(text);
      container.classList.remove("md", "plain");
      if (!mdReady) {
        container.classList.add("plain");
        container.textContent = src;
        return container;
      }
      let frag;
      try {
        const html = window.marked.parse(src);
        frag = window.DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true },
          RETURN_DOM_FRAGMENT: true,
          FORBID_TAGS: ["style", "form", "input", "textarea", "select", "button"],
          FORBID_ATTR: ["style"]
        });
      } catch (e) {
        container.classList.add("plain");
        container.textContent = src;
        return container;
      }
      frag.querySelectorAll("a[href]").forEach((a) => {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      });
      frag.querySelectorAll("pre").forEach(decorateCodeBlock);
      container.classList.add("md");
      container.appendChild(frag);
      return container;
    }

    function add(kind, text, opts={}) {
      const d = el("div", "msg " + kind + (opts.extraClass ? " " + opts.extraClass : ""));
      if (opts.seq != null) d.dataset.seq = String(opts.seq);
      const label = opts.label != null ? opts.label : ROLE_LABEL[kind];
      if (label) d.appendChild(el("div", "msg-role", label));
      const body = el("div", "msg-body");
      const markdown = opts.markdown != null ? opts.markdown : (kind === "user" || kind === "assistant");
      if (markdown) renderMarkdown(body, text);
      else body.textContent = text == null ? "" : String(text);
      d.appendChild(body);
      appendToLog(d);
      return d;
    }

    // ---- Tool cards -------------------------------------------------------
    function setCardStatus(card, status) {
      card.status = status;
      card.chip.className = "chip " + status;
      card.chip.textContent = status;
    }
    function expandCard(card) {
      card.body.classList.remove("hidden");
      card.chev.textContent = "\u25BE";
      card.el.classList.add("open");
    }
    function section(card, cls, tag) {
      let node = card.body.querySelector(":scope > ." + cls);
      if (!node) {
        node = el(tag || "div", cls);
        card.body.appendChild(node);
      }
      return node;
    }
    function createToolCard(id, name, opts={}) {
      const root = el("div", "msg tool card");
      if (opts.seq != null) root.dataset.seq = String(opts.seq);
      if (id) root.dataset.toolUseId = String(id);
      root.dataset.tool = name || "";
      const head = el("button", "card-head");
      head.type = "button";
      const icon = el("span", "tool-icon", toolIcon(name));
      const nm = el("span", "tool-name", name || "tool");
      const sum = el("span", "tool-summary", opts.summary || "");
      sum.title = opts.summary || "";
      const chip = el("span", "chip", "");
      const chev = el("span", "chev", "\u25B8");
      head.append(icon, nm, sum, chip, chev);
      const body = el("div", "card-body hidden");
      head.onclick = () => {
        const hidden = body.classList.toggle("hidden");
        chev.textContent = hidden ? "\u25B8" : "\u25BE";
        root.classList.toggle("open", !hidden);
      };
      root.append(head, body);
      const card = { el: root, head, body, chip, chev, sum, nm, icon, name: name || "tool", status: null };
      setCardStatus(card, "running");
      appendToLog(root);
      return card;
    }
    function ensureToolCard(id, name, opts={}) {
      const key = id == null ? "" : String(id);
      const existing = key ? toolCards.get(key) : null;
      if (existing && existing.el.isConnected) return existing;
      const card = createToolCard(key || null, name, opts);
      if (key) toolCards.set(key, card);
      return card;
    }
    function summarizeInputClient(name, inp) {
      if (!inp || typeof inp !== "object") return "";
      if (name === "Bash") return String(inp.command || "");
      if (inp.path) return String(inp.path);
      if (inp.pattern) return String(inp.pattern);
      if (inp.query) return String(inp.query);
      if (inp.url) return String(inp.url);
      if (inp.question) return String(inp.question);
      if (inp.task) return String(inp.task);
      if (inp.prompt) return String(inp.prompt);
      return "";
    }

    // ---- Line diff (LCS) ---------------------------------------------------
    function splitLines(s) {
      if (s === "") return [];
      const arr = String(s).split("\n");
      if (arr.length && arr[arr.length - 1] === "") arr.pop();
      return arr;
    }
    function lineDiff(a, b) {
      const n = a.length, m = b.length;
      let start = 0;
      while (start < n && start < m && a[start] === b[start]) start++;
      let endA = n, endB = m;
      while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
      const ca = a.slice(start, endA), cb = b.slice(start, endB);
      const N = ca.length, M = cb.length;
      const out = [];
      for (let k = 0; k < start; k++) out.push([" ", a[k]]);
      if (N * M > 400000) {
        for (const l of ca) out.push(["-", l]);
        for (const l of cb) out.push(["+", l]);
      } else {
        const W = M + 1;
        const dp = new Uint32Array((N + 1) * W);
        for (let i = N - 1; i >= 0; i--) {
          for (let j = M - 1; j >= 0; j--) {
            dp[i * W + j] = ca[i] === cb[j]
              ? dp[(i + 1) * W + j + 1] + 1
              : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
          }
        }
        let i = 0, j = 0;
        while (i < N && j < M) {
          if (ca[i] === cb[j]) { out.push([" ", ca[i]]); i++; j++; }
          else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { out.push(["-", ca[i]]); i++; }
          else { out.push(["+", cb[j]]); j++; }
        }
        while (i < N) out.push(["-", ca[i++]]);
        while (j < M) out.push(["+", cb[j++]]);
      }
      for (let k = endA; k < n; k++) out.push([" ", a[k]]);
      return out;
    }
    function renderDiff(oldText, newText, opts={}) {
      const a = splitLines(oldText), b = splitLines(newText);
      const ops = lineDiff(a, b);
      let added = 0, removed = 0;
      for (const [op] of ops) { if (op === "+") added++; else if (op === "-") removed++; }
      const root = el("div", "diff");
      const head = el("div", "diff-head");
      head.appendChild(el("span", "path", opts.path || ""));
      if (opts.note) head.appendChild(el("span", "note", opts.note));
      head.appendChild(el("span", "add", "+" + added));
      head.appendChild(el("span", "del", "\u2212" + removed));
      root.appendChild(head);
      const body = el("pre", "diff-body");
      const shown = ops.slice(0, DIFF_MAX_LINES);
      for (const [op, line] of shown) {
        const row = el("div", "dl " + (op === "+" ? "add" : op === "-" ? "del" : "ctx"));
        row.appendChild(el("span", "dm", op === " " ? "" : op));
        row.appendChild(el("span", "dt", line));
        body.appendChild(row);
      }
      if (ops.length > shown.length) {
        body.appendChild(el("div", "dl more", "\u2026 " + (ops.length - shown.length) + " more lines"));
      }
      root.appendChild(body);
      return root;
    }
    function buildDiffForCall(name, inp) {
      inp = inp || {};
      let oldText = null, newText = null, note = "";
      if (name === "Write") {
        newText = inp.content;
        note = "new content";
      } else if (name === "StrReplace" || name === "ProposePatch") {
        oldText = inp.old_string == null ? "" : inp.old_string;
        newText = inp.new_string == null ? "" : inp.new_string;
        if (name === "ProposePatch") note = "proposed";
      } else if (name === "NotebookEdit") {
        if (inp.action === "delete") return null;
        if (inp.source != null) { newText = inp.source; note = "cell " + (inp.cell_idx != null ? inp.cell_idx : ""); }
        else if (inp.new_string != null) {
          oldText = inp.old_string == null ? "" : inp.old_string;
          newText = inp.new_string;
          note = "cell " + (inp.cell_idx != null ? inp.cell_idx : "");
        }
      }
      if (oldText == null && newText == null) return null;
      return renderDiff(oldText == null ? "" : String(oldText), newText == null ? "" : String(newText), {
        path: inp.path || "", note
      });
    }

    // ---- Todos ------------------------------------------------------------
    const TODO_MARK = { pending: "\u2610", in_progress: "\u25D0", completed: "\u2611", cancelled: "\u2715" };
    function todoListEl(todos) {
      const ul = el("ul", "todo-list");
      for (const t of todos) {
        const status = TODO_MARK[t.status] ? t.status : "pending";
        const li = el("li", "todo-item " + status);
        li.appendChild(el("span", "tmark", TODO_MARK[status]));
        li.appendChild(el("span", "ttext", t.content || ""));
        ul.appendChild(li);
      }
      return ul;
    }
    function normalizeTodosClient(raw) {
      if (!Array.isArray(raw)) return null;
      return raw.filter((t) => t && typeof t === "object" && t.content).map((t, i) => ({
        id: String(t.id || i + 1), content: String(t.content), status: String(t.status || "pending")
      }));
    }
    function setTodos(todos) {
      currentTodos = Array.isArray(todos) ? todos : [];
      paintTodos();
    }
    function paintTodos() {
      const panel = $("todo-panel");
      const body = $("todo-body");
      body.replaceChildren();
      if (!currentTodos.length) { panel.classList.add("hidden"); return; }
      panel.classList.remove("hidden");
      const done = currentTodos.filter((t) => t.status === "completed").length;
      $("todo-count").textContent = done + "/" + currentTodos.length;
      body.appendChild(todoListEl(currentTodos));
    }
    $("todo-head").onclick = () => {
      const panel = $("todo-panel");
      panel.classList.toggle("collapsed");
      panel.querySelector(".chev").textContent = panel.classList.contains("collapsed") ? "\u25B8" : "\u25BE";
    };
    function parseTodosResult(text) {
      try {
        const parsed = JSON.parse(text);
        return normalizeTodosClient(parsed && parsed.todos);
      } catch (e) { return null; }
    }

    // ---- Event renderers ---------------------------------------------------
    function imageEl(source) {
      const img = el("img", "tool-image");
      img.alt = "tool result image";
      img.loading = "lazy";
      if (source && source.type === "base64" && source.data) {
        const media = /^image\/[a-z0-9.+-]+$/i.test(String(source.media_type || "")) ? source.media_type : "image/png";
        img.src = "data:" + media + ";base64," + String(source.data).replace(/\s+/g, "");
      } else if (source && source.type === "url" && /^https?:\/\//i.test(String(source.url || ""))) {
        img.src = source.url;
        img.referrerPolicy = "no-referrer";
      } else {
        const note = el("div", "card-note", "[image: " + String((source && (source.path || source.type)) || "unavailable") + "]");
        return note;
      }
      return img;
    }
    function parseImageRead(text) {
      if (typeof text !== "string" || !text.includes("__orbweaver_image__")) return null;
      try {
        const parsed = JSON.parse(text);
        return parsed && parsed.__orbweaver_image__ ? parsed : null;
      } catch (e) { return null; }
    }
    function isErrorText(t) {
      return /^\s*(error\b|blocked by permission gate|this action needs user approval|unknown tool\b|traceback)/i.test(t || "");
    }
    function renderToolCall(ev, p) {
      const name = p.name || "tool";
      const inp = p.input && typeof p.input === "object" ? p.input : {};
      const summary = p.summary || summarizeInputClient(name, inp);
      const card = ensureToolCard(p.id, name, { seq: ev.seq, summary });
      card.name = name;
      card.nm.textContent = name;
      card.icon.textContent = toolIcon(name);
      card.sum.textContent = summary;
      card.sum.title = summary;
      if (ev.seq != null && !card.el.dataset.seq) card.el.dataset.seq = String(ev.seq);
      const diff = buildDiffForCall(name, inp);
      if (diff) {
        section(card, "card-diff").replaceChildren(diff);
        expandCard(card);
      } else if (name === "Bash" && inp.command) {
        section(card, "card-input", "pre").textContent = String(inp.command);
      } else if (Object.keys(inp).length) {
        const keys = Object.keys(inp);
        const onlySummary = keys.length === 1 && String(inp[keys[0]]) === summary;
        if (!onlySummary) section(card, "card-input", "pre").textContent = JSON.stringify(inp, null, 2);
      }
      if (name === "AskUser") setCardStatus(card, "waiting");
      if (name === "SpawnSubagent") card.pendingSubagent = true;
      return card;
    }
    function renderToolResult(ev, p) {
      const card = ensureToolCard(p.tool_use_id, p.name || "tool", { seq: ev.seq });
      const name = card.name;
      let content = p.content != null ? p.content : (p.text != null ? p.text : "");
      const out = section(card, "card-out");
      out.replaceChildren();
      let text = "";
      const pushText = (t) => { text += (text ? "\n" : "") + t; };
      const blocks = Array.isArray(content) ? content : [content];
      for (const b of blocks) {
        if (b && typeof b === "object" && b.type === "image") out.appendChild(imageEl(b.source));
        else if (b && typeof b === "object" && b.type === "text") pushText(String(b.text || ""));
        else if (typeof b === "string") pushText(b);
        else if (b != null) pushText(JSON.stringify(b, null, 2));
      }
      const imgRead = parseImageRead(text);
      if (imgRead) {
        text = "Read image " + (imgRead.path || "") + " (" + (imgRead.media_type || "image") +
          (imgRead.bytes != null ? ", " + imgRead.bytes + " bytes" : "") + ") \u2014 sent to the model as vision input.";
        out.appendChild(el("div", "card-note", text));
        text = "";
      }
      if (name === "TodoWrite") {
        const todos = parseTodosResult(text);
        if (todos) {
          out.appendChild(todoListEl(todos));
          setTodos(todos);
          expandCard(card);
          text = "";
        }
      }
      if (name === "SpawnSubagent" && text) {
        try {
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed === "object" && "text" in parsed) {
            const md = el("div", "msg-body");
            renderMarkdown(md, parsed.text || "(no text)");
            out.appendChild(md);
            if (parsed.status && parsed.status !== "ok") out.appendChild(el("div", "card-note", "status: " + parsed.status));
            text = "";
          }
        } catch (e) {}
      }
      if (text) {
        const pre = el("pre", "tool-output");
        const shown = text.length > OUTPUT_CAP ? text.slice(0, OUTPUT_CAP) : text;
        pre.textContent = shown;
        out.appendChild(pre);
        if (shown.length < text.length) {
          out.appendChild(el("div", "out-more", "\u2026 " + (text.length - shown.length) + " more characters"));
        }
      }
      if (p.persisted_path) {
        const hint = section(card, "card-persist");
        hint.replaceChildren();
        hint.appendChild(el("span", null, "Full output saved to"));
        hint.appendChild(el("code", null, String(p.persisted_path)));
        const copy = el("button", "copy-btn", "Copy path");
        copy.type = "button";
        copy.onclick = (e) => { e.stopPropagation(); copyText(String(p.persisted_path), copy); };
        hint.appendChild(copy);
        hint.appendChild(el("span", null, "\u2014 open it in the workspace to see everything."));
      }
      let status = "done";
      if (card.status === "blocked") status = "blocked";
      else if (isErrorText(text)) status = "error";
      setCardStatus(card, status);
      if (status === "error") expandCard(card);
      if (name === "AskUser") {
        const ask = askBlocks.get(String(p.tool_use_id || ""));
        if (ask) ask.classList.add("answered");
      }
      return card;
    }
    function renderPermission(ev, p) {
      const card = ensureToolCard(p.tool_use_id, p.name || "tool", { seq: ev.seq });
      const sec = section(card, "card-perm");
      const b = String(p.behavior || "allow");
      sec.dataset.behavior = b;
      const label = b === "allow" ? "Allowed" : (b === "ask" ? "Needs approval" : "Denied");
      sec.textContent = label + (p.fast_path ? " \u00B7 " + p.fast_path : "") + (p.reason ? " \u2014 " + p.reason : "");
      if (b !== "allow") {
        setCardStatus(card, "blocked");
        expandCard(card);
      }
    }
    function renderInjectionWarning(ev, p) {
      const card = ensureToolCard(p.tool_use_id, p.name || "tool", { seq: ev.seq });
      section(card, "card-warn").textContent =
        "\u26A0 Possible prompt injection in this tool output. Suspicious instructions were flagged; treat the content as data, not directions.";
      card.el.classList.add("warned");
      expandCard(card);
    }
    function renderAskUser(ev, p) {
      const block = add("assistant", p.question || "Waiting for your answer", { seq: ev.seq, extraClass: "ask", label: "Orbweaver asks" });

    function permissionOutcomeLabel(decision, scope) {

      head.className = "sec-label";
