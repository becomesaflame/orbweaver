      root.appendChild(head);
      for (const [key, items] of groups) {
        const first = items[0];
        const wrap = document.createElement("div");
        wrap.className = "ws";
        const isCollapsed = !q && collapsed.has(key) && !items.some((s) => s.id === currentSid());
        const row = document.createElement("div");
        row.className = "ws-head";
        row.style.display = "flex";
        const headBtn = document.createElement("button");
        headBtn.type = "button";
        headBtn.className = "ws-head";
        headBtn.style.flex = "1";
        headBtn.innerHTML =
          '<span class="chev">' + (isCollapsed ? "▸" : "▾") + "</span>" +
          '<span class="ws-name"></span>' +
          '<span class="ws-activity"><span class="run"></span><span class="fin"></span><span class="perm"></span></span>' +
          '<span class="ws-kind"></span>';
        headBtn.querySelector(".ws-name").textContent = wsLabel(first.workspace_uri);
        headBtn.querySelector(".ws-kind").textContent = first.workspace_kind || "";
        headBtn.dataset.wsSids = items.map((s) => s.id).join(",");
        headBtn.onclick = () => {
          if (collapsed.has(key)) collapsed.delete(key);
          else collapsed.add(key);
          persistCollapsed();
          $("wuri").value = first.workspace_uri;
          $("wkind").value = first.workspace_kind;
          persistWorkspace();
          paintSessions();
        };
        const addWs = document.createElement("button");
        addWs.type = "button";
        addWs.className = "icon-btn";
        addWs.title = "New chat in this workspace";
        addWs.textContent = "+";
        addWs.onclick = () => {
          createSession(first.workspace_uri, first.workspace_kind).catch((err) => {
            $("status").textContent = String(err);
          });
        };
        row.append(headBtn, addWs);
        wrap.appendChild(row);
        if (!isCollapsed) {
          const limit = expandedExtra.has(key) || q ? items.length : 6;
          items.slice(0, limit).forEach((s) => wrap.appendChild(chatButton(s)));
          if (items.length > limit) {
            const more = document.createElement("button");
            more.type = "button";
            more.className = "more";
            more.textContent = "More";
            more.onclick = () => { expandedExtra.add(key); persistCollapsed(); paintSessions(); };
            wrap.appendChild(more);
          }
        }
        root.appendChild(wrap);
      }
      paintActivity();
    }

    // The running spinner / done highlight for one rail row. Split out of
    // chatButton so paintActivity can restyle rows in place: a full
    // paintSessions() on every turn boundary would drop the search box's
    // scroll position and fight the rename dblclick.
    function paintChatState(b, sid) {
      const running = runningSids.has(sid);
      const done = !running && doneSids.has(sid);
      const permWaiting = waitingPermSids.has(sid);  // visible even while running
      b.classList.toggle("running", running && !permWaiting);
      b.classList.toggle("done", done && !permWaiting);
      b.classList.toggle("perm-waiting", permWaiting);
      b.title = permWaiting
        ? "⚠ Waiting for your approval — click to open"
        : running
          ? "Working…"
          : done
            ? "Finished — click to open"
            : "Double-click to rename";
      const time = b.querySelector(".chat-time");
      if (time) {
        if (permWaiting) time.textContent = "⚠";
        else if (running) time.textContent = "…";
        else {
          const row = sessions.find((s) => s.id === sid);
          time.textContent = row ? timeAgo(row.last_event_at || row.created_at) : "";
        }
      }
      const badge = b.querySelector(".perm-badge");
      if (badge) badge.style.display = permWaiting ? "" : "none";
    }
    function paintActivity() {
      const root = $("session-list");
      const shown = new Set();
      root.querySelectorAll("button.chat[data-sid]").forEach((b) => {
        shown.add(b.dataset.sid);
        paintChatState(b, b.dataset.sid);
      });
      // Roll up whatever the group is hiding: collapsed, or past "More".
      root.querySelectorAll("button.ws-head[data-ws-sids]").forEach((head) => {
        const sids = (head.dataset.wsSids || "").split(",").filter(Boolean);
        const hidden = sids.filter((sid) => !shown.has(sid));
        const running = hidden.filter((sid) => runningSids.has(sid)).length;
        const finished = hidden.filter((sid) => !runningSids.has(sid) && doneSids.has(sid)).length;
        const permWaiting = hidden.filter((sid) => waitingPermSids.has(sid)).length;
        const box = head.querySelector(".ws-activity");
        if (!box) return;
        box.classList.toggle("on", running > 0 || finished > 0 || permWaiting > 0);
        const run = box.querySelector(".run");
        const fin = box.querySelector(".fin");
        const perm = box.querySelector(".perm");
        run.textContent = running ? String(running) : "";
        run.classList.toggle("off", !running);
        fin.textContent = finished ? String(finished) : "";
        fin.classList.toggle("off", !finished);
        if (perm) {
          perm.textContent = permWaiting ? String(permWaiting) : "";
          perm.classList.toggle("off", !permWaiting);
        }
        const bits = [];
        if (running) bits.push(running + " working");
        if (permWaiting) bits.push(permWaiting + " awaiting approval");
        if (finished) bits.push(finished + " finished");
        box.title = bits.join(", ");
      });
    }

    function chatButton(s) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chat" + (s.id === currentSid() ? " active" : "");
      b.dataset.sid = s.id;
      const state = document.createElement("span");
      state.className = "chat-state";
      state.innerHTML = '<span class="spin"></span><span class="bell"></span><span class="perm-badge" style="display:none">!</span>';
      const title = document.createElement("span");
      title.className = "chat-title";
      title.textContent = s.title || "New chat";
      const time = document.createElement("span");
      time.className = "chat-time";
      b.append(state, title, time);
      paintChatState(b, s.id);
      b.onclick = () => { markSeen(s.id); setActive(s); };
      b.ondblclick = async (e) => {
        e.preventDefault();
        await promptRename(s.id);
      };
      b.oncontextmenu = (e) => {
        e.preventDefault();
        openChatMenu(s.id, e.clientX, e.clientY);
      };
      return b;
    }

    // Right-click menu over a rail row. One menu element is reused for every
    // row; openChatMenu() rebinds it to the session under the pointer.
    let chatMenuSid = "";
    function chatMenuOpen() { return !$("chat-menu").classList.contains("hidden"); }
    function openChatMenu(sid, x, y) {
      const row = sessions.find((s) => s.id === sid);
      if (!row) return;
      chatMenuSid = sid;
      const menu = $("chat-menu");
      $("chat-menu-label").textContent = row.title || "New chat";
      menu.classList.remove("hidden");
      menu.setAttribute("aria-hidden", "false");
      positionChatMenu(x, y);
      $("chat-menu-rename").focus();
    }
    function positionChatMenu(x, y) {
      // Place at the pointer, then pull back inside the viewport so a row near
      // the bottom or right edge does not open a menu that is half off-screen.
      const menu = $("chat-menu");
      menu.style.left = "0px";
      menu.style.top = "0px";
      const r = menu.getBoundingClientRect();
      const left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4));
      const top = Math.max(4, Math.min(y, window.innerHeight - r.height - 4));
      menu.style.left = left + "px";
      menu.style.top = top + "px";
    }
    function closeChatMenu() {
      if (!chatMenuOpen()) return;
      chatMenuSid = "";
      const menu = $("chat-menu");
      menu.classList.add("hidden");
      menu.setAttribute("aria-hidden", "true");
    }
    async function promptRename(sid) {
      const row = sessions.find((s) => s.id === sid);
      const next = prompt("Rename chat", (row && row.title) || "");
      if (next == null) return;
      const title = next.trim();
      if (!title) return;
      try {
        await renameSession(sid, title);
      } catch (err) { $("status").textContent = String(err); }
    }
    // Deleting is a soft delete on the gateway, but the confirm still matters:
    // the chat leaves the rail and the UI offers no way back.
    async function confirmDelete(sid) {
      const row = sessions.find((s) => s.id === sid);
      const name = (row && row.title) || "this chat";
      if (!confirm("Delete \u201C" + name + "\u201D?\n\nIt disappears from the sidebar.")) return;
      try {
        await deleteSession(sid);
      } catch (err) { $("status").textContent = String(err); }
    }
    $("chat-menu-rename").onclick = () => {
      const sid = chatMenuSid;
      closeChatMenu();
      promptRename(sid);
    };
    $("chat-menu-delete").onclick = () => {
      const sid = chatMenuSid;
      closeChatMenu();
      confirmDelete(sid);
    };
    // Any click outside, scroll, resize, or Escape dismisses the menu.
    document.addEventListener("click", (e) => {
      if (chatMenuOpen() && !$("chat-menu").contains(e.target)) closeChatMenu();
    });
    document.addEventListener("contextmenu", (e) => {
      if (chatMenuOpen() && !e.target.closest(".chat")) closeChatMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && chatMenuOpen()) { e.stopPropagation(); closeChatMenu(); }
    });
    window.addEventListener("resize", closeChatMenu);
    window.addEventListener("blur", closeChatMenu);
    $("session-list").addEventListener("scroll", closeChatMenu, { passive: true });

    // Rename: PATCH the session, then keep the rail row and the title bar in
    // sync without waiting for the next /v1/sessions poll.
    async function renameSession(sid, title) {
      const r = await api("/v1/sessions/" + sid, {
        method: "PATCH",
        body: JSON.stringify({ title }),
      });
      const next = (r && r.title) || title;
      const row = sessions.find((s) => s.id === sid);
      if (row) row.title = next;
      if (sid === currentSid()) setChatTitle(next);
      paintSessions();
      return next;
    }

    // Delete: soft-delete on the gateway, then drop the row locally so the rail
    // updates before the next /v1/sessions poll. If the deleted chat was open,
    // move to the next most recent one (or a blank slate when none is left).
    async function deleteSession(sid) {
      await api("/v1/sessions/" + sid, { method: "DELETE" });
      const wasCurrent = sid === currentSid();
      sessions = sessions.filter((s) => s.id !== sid);
      stoppedSids.delete(sid);
      waitingAskSids.delete(sid);
      waitingPermSids.delete(sid);
      followupQueues.delete(sid);
      try { sessionStorage.removeItem("orbweaver.queue." + sid); } catch (e) {}
      if (!wasCurrent) {
        paintSessions();
        return;
      }
      const next = sessions[0];
      if (next) {
        setActive(next);
      } else {
        $("sid").value = "";
        persistSid();
        resetLog();
        $("log").innerHTML = '<div class="placeholder">No chats. Start one with New chat.</div>';
        setChatTitle("");
        history.replaceState(null, "", "#/");
        paintSessions();
      }
      $("status").textContent = "Chat deleted.";
    }

    // Title bar rename: clicking #chat-title swaps in #chat-title-edit.
    let titleEditing = false;
    function setChatTitle(text) {
      $("chat-title").textContent = text || "New chat";
    }
    function paintContext(ctx) {
      const where = $("chat-where");
      const meter = $("ctx-meter");
      if (!ctx || typeof ctx !== "object") {
        where.textContent = "";
        meter.classList.add("hidden");
        return;
      }
      const parts = [];
      if (ctx.workspace) parts.push(String(ctx.workspace));
      if (ctx.branch) parts.push("branch " + ctx.branch);
      if (parts.length) where.textContent = parts.join(" \u00b7 ");
      const window = Number(ctx.window);
      const tokens = Number(ctx.tokens);
      if (!Number.isFinite(window) || window <= 0) {
        meter.classList.add("hidden");
        return;
      }
      const used = Number.isFinite(tokens) ? Math.max(0, tokens) : 0;
      const pct = Math.max(0, Math.min(100, (used / window) * 100));
      $("ctx-fill").style.width = pct + "%";
      $("ctx-nums").textContent = used.toLocaleString("en-US") + " / " + window.toLocaleString("en-US");
      meter.title = Math.round(pct) + "% of context window";
      meter.classList.remove("hidden");
    }
    function paintWhereFromSession(session) {
      if (!session) { paintContext(null); return; }
      paintContext({ workspace: wsLabel(session.workspace_uri), branch: session.branch || "" });
    }
    function startTitleEdit() {
      if (titleEditing) return;
      const sid = currentSid();
      if (!sid) return;
      const row = sessions.find((s) => s.id === sid);
      titleEditing = true;
      const input = $("chat-title-edit");
      input.value = (row && row.title) || $("chat-title").textContent || "";
      $("chat-title").classList.add("hidden");
      input.classList.remove("hidden");
      input.focus();
      input.select();
    }
    function cancelTitleEdit() {
      if (!titleEditing) return;
      titleEditing = false;
      $("chat-title-edit").classList.add("hidden");
      $("chat-title").classList.remove("hidden");
    }
    async function commitTitleEdit() {
      if (!titleEditing) return;
      const sid = currentSid();
      const next = $("chat-title-edit").value.trim();
      const row = sessions.find((s) => s.id === sid);
      cancelTitleEdit();
      if (!sid || !next || next === ((row && row.title) || "")) return;
      setChatTitle(next);
      try {
        await renameSession(sid, next);
      } catch (e) {
        $("status").textContent = String(e);
        if (row) setChatTitle(row.title);
      }
    }
    $("chat-title").addEventListener("click", startTitleEdit);
    $("chat-title").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      startTitleEdit();
    });
    $("chat-title-edit").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commitTitleEdit(); return; }
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); cancelTitleEdit(); }
    });
    $("chat-title-edit").addEventListener("blur", () => { commitTitleEdit(); });

    function paintConnection(ok) {
      $("conn-dot").classList.toggle("ok", !!ok);
      $("conn-label").textContent = ok ? "Linked" : "Offline";
    }

    // One in-flight GET /v1/sessions. The rail poll, turn-done, and chat
    // switches all call this; overlapping listings used to pile up on the
    // gateway and freeze the tab until they drained.
    let refreshWaiters = null;
    let refreshAgain = false;
    async function refreshSessions() {
      if (refreshWaiters) {
        refreshAgain = true;
        return refreshWaiters;
      }
      refreshWaiters = (async () => {
        try {
          await refreshSessionsOnce();
        } finally {
          const again = refreshAgain;
          refreshAgain = false;
          refreshWaiters = null;
          if (again) await refreshSessions();
        }
      })();
      return refreshWaiters;
    }
    async function refreshSessionsOnce() {
      if (!$("token").value.trim()) {
        sessions = [];
        paintSessions();
        paintConnection(false);
        return;
      }
      try {
        const r = await api("/v1/sessions");
        sessions = r.sessions || [];
        setGatewayRunning(sessions.filter((s) => s.running).map((s) => s.id));
        pruneDone(sessions.map((s) => s.id));
        paintConnection(true);
        const cur = currentSession();
        if (cur) setChatTitle(cur.title);
        paintSessions();
        if (!modelsLoaded) await loadModels(); else paintModelPicker();
      } catch (e) {
        paintConnection(false);
        $("status").textContent = String(e);
        paintSessions();
      }
    }

    // Turns started outside this tab (Telegram, cron, a second browser) only
    // show up on the next /v1/sessions read, so poll the rail while the page is
    // visible. Faster while something is running, so the spinner stops and the
    // done highlight appears promptly. `orbweaver.pollMs` in localStorage
    // overrides the idle cadence (the e2e suite drives it fast).
    const ACTIVITY_POLL_IDLE_MS = Number(localStorage.getItem(LS.pollMs)) || 8000;
    const ACTIVITY_POLL_BUSY_MS = Math.min(3000, ACTIVITY_POLL_IDLE_MS);
    let activityTimer = null;
    function startActivityPoll() {
      if (activityTimer) clearTimeout(activityTimer);
      const tick = async () => {
        activityTimer = null;
        if (document.visibilityState !== "hidden" && $("token").value.trim()) {
          try { await refreshSessions(); } catch (e) {}
        }
        const busy = runningSids.size > 0;
        activityTimer = setTimeout(tick, busy ? ACTIVITY_POLL_BUSY_MS : ACTIVITY_POLL_IDLE_MS);
      };
      activityTimer = setTimeout(tick, ACTIVITY_POLL_BUSY_MS);
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") startActivityPoll();
    });

    async function loadHistory() {
      const sid = currentSid();
      const gen = ++historyGen;
      if (!sid) {
        $("status").textContent = "";
        paintContext(null);
        resetLog();
        $("log").innerHTML = '<div class="placeholder">Start a new chat or pick one from the left.</div>';
        _resetAutoscroll();
        return;
      }
      if (!$("token").value.trim()) {
        return;
      }
      try {
        const r = await api("/v1/sessions/" + sid + "/events");
        if (gen !== historyGen || currentSid() !== sid) return;
        // Skip a rebuild only when this session's log is already on screen and a
        // live turn is appending to it. Switching back from another chat must
        // still replace the transcript — otherwise the rail/title update and
        // the messages stay on the previous session.
        if (flightFor(sid) && logSid === sid) {
          if (r.context) paintContext(r.context);
          syncComposer();
          return;
        }
        resetLog();
        logSid = sid;
        _resetAutoscroll();
        const evs = r.events || [];
        stoppedSids.delete(sid);
        waitingAskSids.delete(sid);
        waitingPermSids.delete(sid);
        if (!evs.length) {
          $("log").innerHTML = '<div class="placeholder">Send a message to begin.</div>';
        } else {
          const BATCH = 24;
          for (let i = 0; i < evs.length; i++) {
            if (gen !== historyGen || currentSid() !== sid) return;
            renderEvent(evs[i]);
            if ((i + 1) % BATCH === 0 && i + 1 < evs.length) {
              await new Promise((r) => requestAnimationFrame(r));
            }
          }
          if (gen !== historyGen || currentSid() !== sid) return;
          syncRestoreDefaults();
          // The gateway classifies the last turn. Do not re-derive it from the
          // final event's kind: bookkeeping events (subagent_result, todo_state)
          // trail a finished turn and used to show a stray Continue button.
          const status = r.last_turn_state;
          if (status === "waiting_ask") waitingAskSids.add(sid);
          else if (status === "waiting_perm") waitingPermSids.add(sid);
          else if (status === "stopped") stoppedSids.add(sid);
          else if (status === undefined) {
            if (pendingAskFromEvents(evs)) waitingAskSids.add(sid);  // older gateway
            else if (pendingPermFromEvents(evs)) waitingPermSids.add(sid);
          }
          paintActivity();
        }
        const flight = flightFor(sid);
        if (flight) {
          if (flight.userEl && !flight.userEl.isConnected && flight.text && !flight.userEl.dataset.seq) {
            flight.userEl = add("user", flight.text, { extraClass: "pending" });
            attachUserActions(flight.userEl, flight.text, null, true);
          }
          if (flight.workingEl && !flight.workingEl.isConnected) {
            flight.workingEl = addWorking();
          }
        }
        $("status").textContent = flight ? "working…" : "";
        if (r.context) paintContext(r.context);
        else paintWhereFromSession(currentSession());
        syncComposer();
        const cur = currentSession();
        if (cur) setChatTitle(cur.title);
      } catch (e) {
        if (gen !== historyGen || currentSid() !== sid) return;
        $("status").textContent = String(e);
      }
    }
    window.addEventListener("hashchange", () => {
      const next = sidFromHash();
      if (!next || next === currentSid()) return;
      const s = sessions.find((x) => x.id === next);
      if (s) { setActive(s); return; }
      $("sid").value = next;
      persistSid();
      setChatTitle("Chat");
      paintContext(null);
      loadHistory();
    });

    async function createSession(uri, kind) {
      if (!$("token").value.trim()) {
        $("settings").classList.remove("hidden");
        $("status").textContent = "paste a JWT from python -m orbweaver.cli mint";
        return;
      }
      persistWorkspace();
      const model = pickedModel();
      const body = {
        workspace_uri: uri || $("wuri").value,
        workspace_kind: "local",
        title: "New chat",
        channel: "web"
      };
      if (model) body.model = model;
      const r = await api("/v1/sessions", { method:"POST", body: JSON.stringify(body) });
      delete $("model").dataset.pending;
      const session = {
        id: r.id,
        title: r.title || "New chat",
        workspace_uri: r.workspace_uri || uri || $("wuri").value,
        workspace_kind: "local",
        model: r.model || model || "",
        created_at: new Date().toISOString(),
        last_event_at: "",
        event_count: 0
      };
      sessions = [session, ...sessions.filter((s) => s.id !== session.id)];
      resetLog();
      logSid = session.id;
      $("log").innerHTML = '<div class="placeholder">Send a message to begin.</div>';
      _resetAutoscroll();
      setActive(session, { skipHistory: true });
      $("status").textContent = "";
      $("text").focus();
      refreshSessions();
    }

    $("newsession").onclick = () => {
      createSession($("wuri").value, $("wkind").value).catch((e) => {
        $("status").textContent = String(e);
      });
    };

    let pickerRel = "";
    function closeWorkspacePicker() {
      $("ws-modal").classList.add("hidden");
    }
    async function openWorkspacePicker() {
      if (!$("token").value.trim()) {
        $("settings").classList.remove("hidden");
        $("status").textContent = "paste a JWT from python -m orbweaver.cli mint";
        return;
      }
      $("ws-new-name").value = "";
      $("ws-modal").classList.remove("hidden");
      await loadPicker("");
      $("ws-new-name").focus();
    }
    function crumbParts(rel) {
      const parts = (rel || "").split("/").filter(Boolean);
      const out = [{ label: "root", rel: "" }];
      let acc = "";
      for (const part of parts) {
        acc = acc ? acc + "/" + part : part;
        out.push({ label: part, rel: acc });
      }
      return out;
    }
    async function loadPicker(rel) {
      pickerRel = rel || "";
      const r = await api("/v1/workspaces?rel=" + encodeURIComponent(pickerRel));
      $("ws-host").textContent = r.host_path || "";
      const crumbs = $("ws-crumbs");
      crumbs.replaceChildren();
      crumbParts(r.rel).forEach((c, i, arr) => {
        if (i) {
          const sep = document.createElement("span");
          sep.className = "sep";
          sep.textContent = "/";
          crumbs.appendChild(sep);
        }
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = c.label;
        b.onclick = () => loadPicker(c.rel).catch((e) => { $("status").textContent = String(e); });
        if (i === arr.length - 1) b.style.fontWeight = "650";
        crumbs.appendChild(b);
      });
      const list = $("ws-dirs");
      list.replaceChildren();
      const dirs = r.dirs || [];
      if (!dirs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No subfolders. Use this folder or create one.";
        list.appendChild(empty);
      }
      dirs.forEach((d) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "dir";
        b.innerHTML = '<span class="name"></span><span class="ws-kind"></span>';
        b.querySelector(".name").textContent = d.name;
        b.querySelector(".ws-kind").textContent = d.uri;
        b.onclick = () => loadPicker(d.rel).catch((e) => { $("status").textContent = String(e); });
        list.appendChild(b);
      });
      $("ws-use").dataset.uri = r.uri;
    }
    $("newworkspace").onclick = () => {
      openWorkspacePicker().catch((e) => { $("status").textContent = String(e); });
    };
    $("ws-cancel").onclick = closeWorkspacePicker;
    $("ws-modal").addEventListener("click", (ev) => {
      if (ev.target === $("ws-modal")) closeWorkspacePicker();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && !$("ws-modal").classList.contains("hidden")) closeWorkspacePicker();
    });
    $("ws-use").onclick = () => {
      const uri = $("ws-use").dataset.uri || "workspace:default";
      const kind = "local";
      $("wuri").value = uri;
      $("wkind").value = kind;
      persistWorkspace();
      closeWorkspacePicker();
      createSession(uri, kind).catch((e) => { $("status").textContent = String(e); });
    };
    $("ws-mkdir").onclick = () => {
      const name = $("ws-new-name").value.trim();
      if (!name) { $("status").textContent = "enter a folder name"; return; }
      api("/v1/workspaces", {
        method: "POST",
        body: JSON.stringify({ parent: pickerRel, name })
      }).then((r) => {
        $("ws-new-name").value = "";
        return loadPicker(r.rel);
      }).catch((e) => { $("status").textContent = String(e); });
    };
    $("ws-new-name").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); $("ws-mkdir").click(); }
    });

    async function requestCancel(discard) {
      const flight = currentFlight();
      if (!flight) return;
      try {
        await api("/v1/sessions/" + flight.sid + "/turns/cancel", {
          method:"POST", body: JSON.stringify({ discard: !!discard })
        });
      } catch (e) { $("status").textContent = String(e); }
    }
    function stopTurn() { requestCancel(false); }
    function cancelPrompt() { requestCancel(true); }
    async function editPrompt(text, seq, el) {
      restoreComposer(text);
      const flight = currentFlight();
      const pending = !!(flight && el && el.classList.contains("pending"));
      const sid = currentSid();
      if (flight) {
        const wait = flight.done;
        await requestCancel(true);
        if (wait) await wait;
      }
      stoppedSids.delete(sid);
      if (pending || seq == null) { syncComposer(); return; }
      const box = el ? el.querySelector(".restore-files-box") : null;
      const restoreFiles = box ? box.checked : turnEditsFilesAfter(seq);
      try {
        const r = await api("/v1/sessions/" + sid + "/rewind", {
          method:"POST", body: JSON.stringify({ from_seq: seq, restore_files: restoreFiles })
        });
        dropFromSeq(seq);
        if (r.checkpoint_restore) {
          const cp = r.checkpoint_restore;
          add("tool", restoreSummaryText(cp), { seq: cp.seq, extraClass: "checkpoint" });
        }
        ensurePlaceholder();
        await refreshSessions();
      } catch (e) { $("status").textContent = String(e); }
      syncComposer();
    }
    async function injectNow() {
      const text = $("text").value.trim();
      const flight = currentFlight();
      if (!text || !flight) return;
      const sid = flight.sid;
      $("text").value = "";
      syncComposer();
      try {
        const r = await api("/v1/sessions/" + sid + "/turns/inject", {
          method:"POST", body: JSON.stringify({ text })
        });
        if (currentSid() === sid && r.seq != null && !renderedSeqs.has(Number(r.seq))) {
          renderedSeqs.add(Number(r.seq));
          const node = add("user", text, { seq: r.seq, extraClass: "injected" });
          attachUserActions(node, text, r.seq, false);
        }
      } catch (e) {
        restoreComposer(text);
        $("status").textContent = String(e);
      }
    }
    function sessionWsUrl(sid) {
      const origin = $("base").value.trim() || window.location.origin;
      const u = new URL("/v1/sessions/" + sid + "/ws", origin);
      u.protocol = u.protocol === "https:" ? "wss:" : "ws:";
      return u.toString();
    }
    function openSessionWs(sid) {
      // The JWT rides in Sec-WebSocket-Protocol ("bearer, <jwt>") rather than
      // the URL so it never lands in access logs; the gateway echoes "bearer".
      const tok = $("token").value.trim();
      const protocols = tok ? ["bearer", tok] : [];
      return new WebSocket(sessionWsUrl(sid), protocols);
    }
    function maxSeqInLog() {
      let top = 0;
      $("log").querySelectorAll("[data-seq]").forEach((n) => {
        const s = Number(n.dataset.seq);
        if (Number.isFinite(s) && s > top) top = s;
      });
      return top;
    }
    const RECONNECT_BASE_MS = 500;
    const RECONNECT_CAP_MS = 10000;
    // Runs one turn over the session WebSocket. If the socket drops after the
    // turn has started, reconnects with backoff and sends
    // {type:"subscribe", after_seq} so the server replays the gap; frames are
    // deduplicated by seq and the promise settles only on turn_done (or a
    // turn_status that says the turn is over).
    function streamTurn(sid, payload, onEvent) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let ws = null;
        let retryTimer = null;
        let attempt = 0;
        let started = false;    // saw at least one stored event for this turn
        let replaying = false;  // between sending subscribe and receiving turn_status
        let lastSeq = maxSeqInLog();
        const seen = new Set();
        const here = () => currentSid() === sid;
        const setLink = (state) => {
          if (!here()) return;
          const w = $("log").querySelector(".msg.working .msg-body");
          if (state === "reconnecting") {
            $("status").textContent = "reconnecting… (" + attempt + ")";
            if (w) w.textContent = "assistant: Working… (reconnecting)";
          } else {
            if ($("status").textContent.startsWith("reconnecting")) $("status").textContent = "working…";
            if (w) w.textContent = "assistant: Working…";
          }
        };
        const finish = (fn, val) => {
          if (settled) return;
          settled = true;
          if (retryTimer) clearTimeout(retryTimer);
          try { if (ws) ws.close(); } catch (e) {}
          if (here() && $("status").textContent.startsWith("reconnecting")) $("status").textContent = "working…";
          fn(val);
        };
        const scheduleReconnect = () => {
          const delay = Math.min(RECONNECT_CAP_MS, RECONNECT_BASE_MS * Math.pow(2, attempt));
          attempt += 1;
          setLink("reconnecting");
          retryTimer = setTimeout(() => connect(true), delay);
        };
        const onFrame = (msg) => {
          if (msg.kind === "subscribed" || msg.kind === "pong" || msg.kind === "cancelling" ||
              msg.kind === "idle" || msg.kind === "injected" || msg.kind === "approval") {
            return;
          }
          if (msg.kind === "context") {
            if (here()) paintContext(msg);
            return;
          }
          if (msg.kind === "turn_status") {
            replaying = false;
            attempt = 0;
            if (msg.running) { setLink("connected"); return; }
            const last = msg.last_turn_done;
            if (!started) {
              finish(reject, new Error("connection lost before the turn started"));
            } else if (last && last.status === "error") {
              finish(reject, new Error(last.detail || "turn failed"));
            } else if (last) {
              finish(resolve, { status: last.status || "ok", user_seq: last.user_seq });
            } else {
              finish(resolve, { status: "stopped", user_seq: null });
            }
            return;
          }
          if (msg.kind === "error") {
            const detail = msg.detail;
            finish(reject, new Error(typeof detail === "string" ? detail : JSON.stringify(detail)));
            return;
          }
          if (msg.kind === "turn_done") {
            finish(resolve, { status: msg.status || "ok", user_seq: msg.user_seq });
            return;
          }
          if (msg.seq != null) {
            started = true;
            if (seen.has(msg.seq)) return;
            seen.add(msg.seq);
            if (msg.seq > lastSeq) lastSeq = msg.seq;
            if (replaying && here() && $("log").querySelector('[data-seq="' + msg.seq + '"]')) return;
          }
          if (onEvent) onEvent(msg);
        };
        function connect(resub) {
          if (settled) return;
          retryTimer = null;
          let sock;
          try { sock = openSessionWs(sid); }
          catch (e) {
            if (resub) scheduleReconnect(); else reject(e);
            return;
          }
          ws = sock;
          sock.onopen = () => {
            if (settled || ws !== sock) return;
            try {
              if (resub) {
                replaying = true;
                sock.send(JSON.stringify({ type: "subscribe", after_seq: lastSeq }));
              } else {
                sock.send(JSON.stringify(payload));
              }
            } catch (e) { try { sock.close(); } catch (e2) {} }
          };
          sock.onmessage = (ev) => {
            if (settled || ws !== sock) return;
            let msg;
            try { msg = JSON.parse(ev.data); }
            catch (e) { finish(reject, e); return; }
            onFrame(msg);
          };
          sock.onerror = () => {};
          sock.onclose = (ev) => {
            if (settled || ws !== sock) return;
            ws = null;
            if (ev.code === 4401) { finish(reject, new Error("unauthorized")); return; }
            if (ev.code === 4404) { finish(reject, new Error("session not found")); return; }
            if (!started) { finish(reject, new Error("WebSocket closed (" + ev.code + ")")); return; }
            replaying = false;
            scheduleReconnect();
          };
        }
        connect(false);
      });
    }
    async function continueTurn() {
      if (currentFlight()) return;
      const sid = currentSid();
      if (!sid) return;
      stoppedSids.delete(sid);
      waitingAskSids.delete(sid);
      waitingPermSids.delete(sid);
      const ph = $("log").querySelector(".placeholder");
      if (ph) ph.remove();
      $("log").querySelectorAll(".msg.stopped").forEach((n) => n.remove());
      const workingEl = addWorking();
      let resolveDone;
      const done = new Promise((r) => { resolveDone = r; });
      const flight = { sid, text: "", userEl: null, workingEl, done };
      setFlight(sid, flight);
      syncComposer();
      $("status").textContent = "working…";
      let turnStatus = null;
      try {
        const r = await streamTurn(sid, { resume: true }, (ev) => {
          if (currentSid() !== sid) return;
          renderEvent(ev);
        });
        finishWorking(sid, workingEl);
        if (currentSid() === sid) {
          if (r.status === "waiting_ask") waitingAskSids.add(sid);
          if (r.status === "waiting_perm") { waitingPermSids.add(sid); paintActivity(); }
          if (r.status === "stopped") stoppedSids.add(sid);
        }
        await refreshSessions();
        turnStatus = r.status;
      } catch (e) {
        finishWorking(sid, workingEl);
        if (currentSid() === sid) addError(e);
      } finally {
        clearFlight(sid, flight);
        if (resolveDone) resolveDone();
        syncComposer();
        if (currentSid() === sid && $("status").textContent === "working…") $("status").textContent = "";
      }
      if (turnStatus != null) await drainQueue(sid, turnStatus);
    }
    async function drainQueue(sid, status) {
      if (status !== "ok") return;
      if (currentSid() !== sid) return;
      const items = qlist(sid);
      if (!items.length) return;
      const next = items.shift();
      persistQueue(sid);
      paintFollowups();
      $("text").value = next.text;
      await send();
    }
    async function send() {
      if (currentFlight()) return;
      const text = $("text").value.trim();
      if (!text) return;
      if (!currentSid()) {
        try { await createSession($("wuri").value, $("wkind").value); }
        catch (e) { addError(e); return; }
      }
      persistSid();
      const sid = currentSid();
      stoppedSids.delete(sid);
      waitingAskSids.delete(sid);
      waitingPermSids.delete(sid);
      const ph = $("log").querySelector(".placeholder");
      if (ph) ph.remove();
      $("text").value = "";
      const userEl = add("user", text, { extraClass: "pending" });
      attachUserActions(userEl, text, null, true);
      const workingEl = addWorking();
      let resolveDone;
      const done = new Promise((r) => { resolveDone = r; });
      const flight = { sid, text, userEl, workingEl, done };
      setFlight(sid, flight);
      syncComposer();
      $("status").textContent = "working…";
      const turnPayload = { text };
      if (pickedModel()) turnPayload.model = pickedModel();
      let turnStatus = null;
      try {
        const r = await streamTurn(sid, turnPayload, (ev) => {
          if (currentSid() !== sid) return;
          if (ev.kind === "user" && !(ev.payload && ev.payload.injected)) {
            const el = (flightFor(sid) && flightFor(sid).userEl) || userEl;
            if (el) {
              el.classList.remove("pending");
              if (ev.seq != null) {
                el.dataset.seq = String(ev.seq);
                renderedSeqs.add(Number(ev.seq));
              }
              attachUserActions(el, text, ev.seq, false);
            }
            return;
          }
          renderEvent(ev);
        });
        const stillHere = currentSid() === sid;
        finishWorking(sid, workingEl);
        const liveUser = (flightFor(sid) && flightFor(sid).userEl) || userEl;
        if (liveUser) liveUser.classList.remove("pending");
        if (r.status === "discarded") {
          if (r.user_seq != null) dropFromSeq(r.user_seq);
          if (liveUser && liveUser.parentNode) liveUser.remove();
          if (stillHere) ensurePlaceholder();
        } else if (stillHere) {
          if (liveUser && r.user_seq != null) liveUser.dataset.seq = String(r.user_seq);
          if (liveUser) attachUserActions(liveUser, text, r.user_seq, false);
          syncRestoreDefaults();
          if (r.status === "waiting_ask") waitingAskSids.add(sid);
          if (r.status === "waiting_perm") { waitingPermSids.add(sid); paintActivity(); }
          if (r.status === "stopped") stoppedSids.add(sid);
        }
        await refreshSessions();
        if (stillHere) {
          const cur = currentSession();
          if (cur) setChatTitle(cur.title);
        }
        turnStatus = r.status;
      } catch (e) {
        finishWorking(sid, workingEl);
        if (userEl) userEl.classList.remove("pending");
        if (currentSid() === sid) addError(e);
      } finally {
        clearFlight(sid, flight);
        if (resolveDone) resolveDone();
        syncComposer();
        if (currentSid() === sid && $("status").textContent === "working…") $("status").textContent = "";
      }
      if (turnStatus != null) await drainQueue(sid, turnStatus);
    }
    $("send").onclick = () => { if (currentFlight()) stopTurn(); else send(); };
    $("queue-btn").onclick = () => enqueue($("text").value.trim());
    $("inject").onclick = () => injectNow();
    $("continue").onclick = () => continueTurn();
    $("text").addEventListener("input", syncComposer);
    $("text").addEventListener("keydown", (e) => {
      if (e.key === "Escape" && currentFlight()) { e.preventDefault(); stopTurn(); return; }
      if (e.key !== "Enter" || e.repeat || e.isComposing) return;
      if (e.shiftKey) return;
      const busy = !!currentFlight();
      if (busy && (e.ctrlKey || e.metaKey)) { e.preventDefault(); injectNow(); return; }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      if (busy) enqueue($("text").value.trim());
      else send();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !currentFlight()) return;
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      e.preventDefault();
      stopTurn();
    });
    $("mic").onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.start();
      $("status").textContent = "recording…";
      await new Promise((r) => setTimeout(r, 4000));
      rec.stop();
      await new Promise((r) => rec.onstop = r);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      const fd = new FormData();
      fd.append("file", blob, "clip.webm");
      const tok = $("token").value.trim();
      const res = await fetch($("base").value + "/v1/stt", {
        method: "POST",
        headers: tok ? { authorization: "Bearer " + tok } : {},
        body: fd
      });
      const data = await res.json();
      if (data.text) { $("text").value = data.text; $("status").textContent = "transcribed"; }
      else { $("status").textContent = JSON.stringify(data); }
    };

    (async function boot() {
      _initAutoscroll();
      await refreshSessions();
      if (!currentSid() && sessions.length) {
        setActive(sessions[0], { skipHistory: true });
      }
      // The chat we open on is being looked at, so it is not "finished, unseen".
      if (markSeen(currentSid())) paintActivity();
      await loadHistory();
      syncComposer();
      startActivityPoll();
    })();
  </script>
</body>
