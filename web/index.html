<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbweaver</title>
  <style>
    :root {
      --bg:#111; --rail:#161616; --panel:#1c1c1c; --ink:#eee; --accent:#7d9b84;
      --muted:#888; --line:#2e2e2e; --hover:#222; --active:#2a2a2a;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body {
      font: 14px/1.45 system-ui, sans-serif;
      background:var(--bg); color:var(--ink);
      display:flex;
    }
    #rail {
      width:17.5rem; min-width:17.5rem; background:var(--rail);
      border-right:1px solid var(--line);
      display:flex; flex-direction:column;
    }
    .brand {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.85rem 0.9rem 0.4rem;
    }
    .brand h1 { font-size:0.95rem; margin:0; font-weight:650; letter-spacing:0.01em; }
    .brand .ver { font-size:0.7rem; color:var(--muted); font-weight:500; }
    .rail-actions { padding:0.35rem 0.7rem 0.5rem; display:flex; flex-direction:column; gap:0.35rem; }
    button {
      font: inherit; color:var(--ink); background:transparent;
      border:0; border-radius:8px; padding:0.45rem 0.6rem; cursor:pointer; text-align:left;
    }
    button:hover { background:var(--hover); }
    .btn-new {
      background:var(--accent); color:#111; font-weight:650;
      display:flex; align-items:center; gap:0.45rem;
    }
    .btn-new:hover { filter:brightness(1.05); background:var(--accent); }
    .search {
      width:100%; background:#1f1f1f; color:var(--ink);
      border:1px solid var(--line); border-radius:8px;
      padding:0.4rem 0.55rem; font:inherit;
    }
    .search::placeholder { color:#666; }
    .rail-list { flex:1; overflow-y:auto; padding:0.25rem 0.45rem 0.8rem; }
    .sec-label {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.55rem 0.45rem 0.25rem;
      font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted);
    }
    .icon-btn { padding:0.15rem 0.3rem; color:var(--muted); border-radius:6px; }
    .ws { margin-bottom:0.2rem; }
    .ws-head {
      width:100%; display:flex; align-items:center; gap:0.4rem;
      color:#cfcfcf; padding:0.35rem 0.4rem; border-radius:8px;
    }
    .ws-head .chev { width:0.7rem; color:var(--muted); flex:none; }
    .ws-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
    .ws-kind { font-size:0.7rem; color:var(--muted); flex:none; }
    .chat {
      width:100%; display:flex; align-items:center; gap:0.4rem;
      padding:0.38rem 0.45rem 0.38rem 1.35rem; border-radius:8px; color:#ddd;
    }
    .chat.active { background:var(--active); color:#fff; }
    .chat-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chat-time { font-size:0.7rem; color:var(--muted); flex:none; }
    .more { color:var(--muted); font-size:0.8rem; padding:0.2rem 0.45rem 0.35rem 1.35rem; }
    .empty { color:var(--muted); padding:1rem 0.7rem; font-size:0.85rem; }
    .rail-foot { border-top:1px solid var(--line); padding:0.55rem 0.7rem 0.8rem; }
    .conn-toggle {
      width:100%; display:flex; align-items:center; gap:0.5rem; color:#ddd;
    }
    .dot { width:0.5rem; height:0.5rem; border-radius:50%; background:#555; flex:none; }
    .dot.ok { background:var(--accent); }
    #settings { margin-top:0.45rem; }
    #settings.hidden { display:none; }
    #settings label { display:block; font-size:0.7rem; color:var(--muted); margin-top:0.45rem; }
    #settings input, #settings textarea {
      width:100%; margin-top:0.2rem; background:#1f1f1f; color:var(--ink);
      border:1px solid var(--line); border-radius:6px; padding:0.35rem 0.45rem; font:inherit;
    }
    .mic { width:100%; margin-top:0.5rem; background:var(--panel); }
    #stage { flex:1; min-width:0; display:flex; flex-direction:column; }
    header.chat-bar {
      padding:0.75rem 1.1rem; border-bottom:1px solid var(--line);
      display:flex; gap:1rem; align-items:baseline;
    }
    header.chat-bar h2 { font-size:0.95rem; margin:0; font-weight:600; }
    #status { color:var(--muted); font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #log { flex:1; overflow-y:auto; padding:1rem 1.15rem; }
    .msg { margin:0.5rem 0; padding:0.65rem 0.75rem; border-radius:8px; background:var(--panel); }
    .msg-body { white-space:pre-wrap; }
    .msg.user { border-left:3px solid var(--accent); }
    .msg.assistant { border-left:3px solid #c4a574; }
    .msg.tool { border-left:3px solid #888; color:#bbb; font-size:0.85rem; }
    .placeholder { color:var(--muted); padding:3rem 1rem; text-align:center; }
    #composer textarea {
      flex:1; min-height:3.2rem; resize:vertical; background:#1f1f1f; color:var(--ink);
      border:1px solid var(--line); border-radius:8px; padding:0.55rem 0.65rem; font:inherit;
    }
    #dock { border-top:1px solid var(--line); }
    #followups { padding:0.5rem 1rem 0; display:flex; flex-direction:column; gap:0.3rem; }
    #followups.hidden { display:none; }
    .q-item {
      display:flex; align-items:center; gap:0.4rem;
      background:var(--panel); border-radius:8px; padding:0.35rem 0.55rem;
      border-left:3px solid #c4a574;
    }
    .q-lab { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-size:0.85rem; color:#ddd; }
    .q-item button { color:var(--muted); padding:0.1rem 0.4rem; }
    #composer { display:flex; gap:0.5rem; padding:0.75rem 1rem 0.35rem; border-top:0; }
    .composer-btns { display:flex; flex-direction:column; gap:0.35rem; justify-content:flex-end; }
    #send { width:auto; background:var(--accent); color:#111; font-weight:650; padding:0.55rem 0.9rem; min-width:6.6rem; }
    #send:hover { background:var(--accent); filter:brightness(1.05); }
    #send.stop { background:#6a4040; color:#f2f2f2; }
    #send.stop:hover { filter:none; background:#7a4a4a; }
    .ghost {
      background:var(--panel); color:var(--ink); font-weight:600;
      padding:0.4rem 0.7rem; white-space:nowrap; min-width:6.6rem;
    }
    .ghost:hover { background:var(--hover); }
    .ghost:disabled { opacity:0.4; cursor:default; }
    .ghost.hidden, #continue.hidden, #queue-btn.hidden, #inject.hidden { display:none; }
    #composer-hint { padding:0 1rem 0.75rem; font-size:0.75rem; color:var(--muted); min-height:1.15rem; }
    .msg.injected { border-left-color:#8aa0c8; }
    .msg.ask { border-left-color:#8aa0c8; }
    .msg-actions { display:flex; gap:0.25rem; margin-top:0.4rem; }
    .msg-actions button {
      font-size:0.75rem; color:var(--muted); padding:0.12rem 0.45rem; border-radius:6px;
    }
    .msg-actions button:hover { color:var(--ink); }
    .msg-actions .restore-files {
      display:flex; align-items:center; gap:0.25rem; font-size:0.75rem; color:var(--muted); cursor:pointer;
    }
    .msg.checkpoint { border-left-color:#8ac8a0; }
    .btn-new.secondary {
      background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600;
    }
    .btn-new.secondary:hover { background:var(--hover); filter:none; }
    #ws-modal.hidden { display:none; }
    #ws-modal {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      display:flex; align-items:center; justify-content:center; z-index:40;
    }
    #ws-modal .sheet {
      width:min(34rem, 94vw); max-height:82vh; overflow:hidden;
      background:var(--panel); border:1px solid var(--line); border-radius:12px;
      display:flex; flex-direction:column;
    }
    #ws-modal header {
      padding:0.85rem 1rem 0.55rem; border-bottom:1px solid var(--line);
    }
    #ws-modal header h3 { margin:0; font-size:0.95rem; font-weight:650; }
    #ws-modal header p { margin:0.35rem 0 0; color:var(--muted); font-size:0.8rem; }
    #ws-crumbs {
      display:flex; flex-wrap:wrap; gap:0.2rem; align-items:center;
      padding:0.55rem 1rem; border-bottom:1px solid var(--line); font-size:0.8rem;
    }
    #ws-crumbs button { padding:0.15rem 0.35rem; color:#cfcfcf; }
    #ws-crumbs .sep { color:var(--muted); }
    #ws-host { padding:0 1rem 0.35rem; color:var(--muted); font-size:0.75rem; word-break:break-all; }
    #ws-dirs { flex:1; overflow-y:auto; padding:0.4rem 0.55rem 0.6rem; min-height:12rem; }
    #ws-dirs .dir {
      width:100%; display:flex; align-items:center; gap:0.45rem;
      padding:0.42rem 0.5rem; border-radius:8px;
    }
    #ws-dirs .dir .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #ws-dirs .empty { padding:1.5rem 0.5rem; }
    #ws-modal footer {
      display:flex; flex-wrap:wrap; gap:0.45rem; align-items:center;
      padding:0.7rem 1rem 0.9rem; border-top:1px solid var(--line);
    }
    #ws-modal footer input {
      background:#1f1f1f; color:var(--ink); border:1px solid var(--line);
      border-radius:6px; padding:0.35rem 0.45rem; font:inherit;
    }
    #ws-new-name { flex:1; min-width:8rem; }
    #ws-modal .grow { flex:1; }
    #ws-use { background:var(--accent); color:#111; font-weight:650; }
    .msg.working, .msg.stopped {
      color:var(--muted); font-style:italic; background:transparent; border-left-color:#555;
    }
  </style>
</head>
<body>
  <aside id="rail">
    <div class="brand"><h1>Orbweaver</h1><span class="ver" id="app-ver"></span></div>
    <div class="rail-actions">
      <button type="button" class="btn-new" id="newsession">+ New chat</button>
      <button type="button" class="btn-new secondary" id="newworkspace">+ New workspace</button>
      <input id="search" class="search" placeholder="Search chats" autocomplete="off">
    </div>
    <div class="rail-list" id="session-list">
      <div class="empty">Paste a JWT in Connection to load chats.</div>
    </div>
    <div class="rail-foot">
      <button type="button" class="conn-toggle" id="settings-toggle">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-label">Connection</span>
      </button>
      <div id="settings" class="hidden">
        <label>Gateway</label>
        <input id="base" value="">
        <label>JWT (from `python -m orbweaver.cli mint`)</label>
        <input id="token" placeholder="paste token from gateway host">
        <label>Workspace URI</label>
        <input id="wuri" value="workspace:default">
        <label>Workspace kind</label>
        <input id="wkind" value="local">
        <label>Session id</label>
        <input id="sid">
        <button type="button" class="mic" id="mic">Record 4s for STT</button>
      </div>
    </div>
  </aside>
  <div id="ws-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="sheet">
      <header>
        <h3 id="ws-modal-title">Choose workspace folder</h3>
        <p>Folders under WORKSPACE_ROOT. Sessions store a portable URI, not an absolute path.</p>
      </header>
      <div id="ws-crumbs"></div>
      <div id="ws-host"></div>
      <div id="ws-dirs"></div>
      <footer>
        <input id="ws-new-name" placeholder="New folder name">
        <button type="button" class="ghost" id="ws-mkdir">Create</button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="ws-cancel">Cancel</button>
        <button type="button" id="ws-use">Use this folder</button>
      </footer>
    </div>
  </div>
  <div id="stage">
    <header class="chat-bar">
      <h2 id="chat-title">New chat</h2>
      <span id="status">disconnected</span>
    </header>
    <div id="log"></div>
    <div id="dock">
      <div id="followups" class="hidden"></div>
      <div id="composer">
        <textarea id="text" placeholder="Message (Shift+Enter for newline)"></textarea>
        <div class="composer-btns">
          <button type="button" id="queue-btn" class="ghost hidden" title="Run after this turn finishes">Queue</button>
          <button type="button" id="inject" class="ghost hidden" title="Fold into the live turn (Ctrl+Enter)">Add to turn</button>
          <button type="button" id="continue" class="ghost hidden" title="Resume the stopped turn">Continue</button>
          <button type="button" id="send">Send</button>
        </div>
      </div>
      <div id="composer-hint"></div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const LS = {
      jwt: "orbweaver.jwt", sid: "orbweaver.sid", wuri: "orbweaver.wuri",
      wkind: "orbweaver.wkind", collapsed: "orbweaver.collapsedWs", expanded: "orbweaver.expandedWs"
    };
    let sessions = [];
    let inFlight = null;
    let stoppedSids = new Set();
    let waitingAskSids = new Set();
    const followupQueues = new Map();
    let collapsed = new Set(JSON.parse(localStorage.getItem(LS.collapsed) || "[]"));
    let expandedExtra = new Set(JSON.parse(localStorage.getItem(LS.expanded) || "[]"));
    $("base").value = location.origin;
    async function pingVersion() {
      try {
        const r = await fetch($("base").value.replace(/\/$/, "") + "/health");
        const j = await r.json();
        $("app-ver").textContent = j.version ? "v" + j.version : "";
      } catch {
        $("app-ver").textContent = "";
      }
    }
    pingVersion();
    const savedTok = localStorage.getItem(LS.jwt);
    if (savedTok) $("token").value = savedTok;
    const savedSid = localStorage.getItem(LS.sid);
    if (savedSid) $("sid").value = savedSid;
    const savedWuri = localStorage.getItem(LS.wuri);
    if (savedWuri) $("wuri").value = savedWuri;
    const savedWkind = localStorage.getItem(LS.wkind);
    if (savedWkind && savedWkind !== "docker") $("wkind").value = savedWkind;
    else $("wkind").value = "local";
    const hashSid = (location.hash.match(/^#\/s\/([0-9a-f-]{36})$/i) || [])[1];
    if (hashSid) $("sid").value = hashSid;
    if (!$("token").value.trim()) $("settings").classList.remove("hidden");

    function persistSid() {
      const sid = $("sid").value.trim();
      if (sid) localStorage.setItem(LS.sid, sid);
      else localStorage.removeItem(LS.sid);
    }
    function persistWorkspace() {
      if ($("wkind").value.trim() === "docker") $("wkind").value = "local";
      localStorage.setItem(LS.wuri, $("wuri").value.trim());
      localStorage.setItem(LS.wkind, $("wkind").value.trim() || "local");
    }
    function persistCollapsed() {
      localStorage.setItem(LS.collapsed, JSON.stringify([...collapsed]));
      localStorage.setItem(LS.expanded, JSON.stringify([...expandedExtra]));
    }
    $("token").addEventListener("input", () => {
      localStorage.setItem(LS.jwt, $("token").value.trim());
      refreshSessions();
    });
    $("base").addEventListener("change", pingVersion);
    $("wuri").addEventListener("input", persistWorkspace);
    $("wkind").addEventListener("input", persistWorkspace);
    $("sid").addEventListener("input", persistSid);
    $("sid").addEventListener("change", () => { persistSid(); loadHistory(); refreshSessions(); });
    window.addEventListener("beforeunload", persistSid);
    $("settings-toggle").onclick = () => $("settings").classList.toggle("hidden");
    $("search").addEventListener("input", paintSessions);

    // Autoscroll: pauses when the user scrolls up; resumes when they return to the bottom.
    let _userScrolled = false;
    function _initAutoscroll() {
      const log = $("log");
      log.addEventListener("scroll", () => {
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        _userScrolled = !atBottom;
      }, { passive: true });
    }
    function _scrollToBottom() {
      if (_userScrolled) return;
      const log = $("log");
      log.scrollTop = log.scrollHeight;
    }
    function _resetAutoscroll() {
      _userScrolled = false;
      _scrollToBottom();
    }

    function add(kind, text, opts={}) {
      const d = document.createElement("div");
      d.className = "msg " + kind + (opts.extraClass ? " " + opts.extraClass : "");
      if (opts.seq != null) d.dataset.seq = String(opts.seq);
      const body = document.createElement("div");
      body.className = "msg-body";
      body.textContent = kind + ": " + text;
      d.appendChild(body);
      $("log").appendChild(d);
      _scrollToBottom();
      return d;
    }
    function attachUserActions(el, text, seq, pending) {
      el.querySelectorAll(".msg-actions").forEach((n) => n.remove());
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit";
      edit.title = pending ? "Pause and edit this prompt" : "Edit this prompt";
      edit.onclick = (ev) => { ev.stopPropagation(); editPrompt(text, seq, el); };
      actions.appendChild(edit);
      if (!pending && seq != null) {
        const lab = document.createElement("label");
        lab.className = "restore-files";
        lab.title = "Put the workspace back to how it was before this turn (git checkpoint)";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.className = "restore-files-box";
        box.dataset.auto = "1";
        box.checked = turnEditsFilesAfter(seq);
        box.onclick = (ev) => ev.stopPropagation();
        box.onchange = () => { box.dataset.auto = "0"; };
        lab.appendChild(box);
        lab.appendChild(document.createTextNode(" also restore files"));
        lab.onclick = (ev) => ev.stopPropagation();
        actions.appendChild(lab);
      }
      if (pending) {
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.title = "Discard this prompt";
        cancel.onclick = (ev) => { ev.stopPropagation(); cancelPrompt(); };
        actions.appendChild(cancel);
      }
      el.appendChild(actions);
    }
    const FILE_EDIT_TOOLS = new Set(["Write", "StrReplace", "Delete", "NotebookEdit", "Bash"]);
    function turnEditsFilesAfter(seq) {
      for (const node of $("log").children) {
        const s = Number(node.dataset.seq);
        if (Number.isFinite(s) && s >= seq && node.dataset.editsFiles === "1") return true;
      }
      return false;
    }
    function syncRestoreDefaults() {
      for (const box of $("log").querySelectorAll(".restore-files-box[data-auto='1']")) {
        const msg = box.closest(".msg");
        const seq = msg ? Number(msg.dataset.seq) : NaN;
        if (Number.isFinite(seq)) box.checked = turnEditsFilesAfter(seq);
      }
    }
    function restoreSummaryText(p) {
      if (p.status === "skipped") return "files not restored: " + (p.note || "no checkpoint");
      const restored = p.restored || [], deleted = p.deleted || [];
      const parts = [];
      if (restored.length) parts.push("restored " + restored.length + " file" + (restored.length === 1 ? "" : "s"));
      if (deleted.length) parts.push("deleted " + deleted.length + " file" + (deleted.length === 1 ? "" : "s"));
      const names = restored.concat(deleted.map((d) => "-" + d));
      const shown = names.slice(0, 6).join(", ") + (names.length > 6 ? ", …" : "");
      return "workspace " + (parts.length ? parts.join(", ") : "already matched the checkpoint")
        + (shown ? " (" + shown + ")" : "");
    }
    function renderEvent(ev) {
      const p = ev.payload || {};
      if (ev.kind === "checkpoint_restore") {
        add("tool", restoreSummaryText(p), { seq: ev.seq, extraClass: "checkpoint" });
        return;
      }
      if (ev.kind === "tool_call" && FILE_EDIT_TOOLS.has(p.name)) {
        const el = add("tool", ev.kind + " " + JSON.stringify(p).slice(0,400), { seq: ev.seq });
        el.dataset.editsFiles = "1";
        return;
      }
      if (ev.kind === "user" || ev.kind === "assistant") {
        const extra = (p.injected || p.stuck_nudge) ? "injected" : "";
        const el = add(ev.kind, p.text || "", { seq: ev.seq, extraClass: extra });
        if (ev.kind === "user") attachUserActions(el, p.text || "", ev.seq, false);
      } else if (ev.kind === "ask_user") {
        add("assistant", p.question || "Waiting for your answer", { seq: ev.seq, extraClass: "ask" });
      } else if (ev.kind === "turn_aborted") {
        add("assistant", p.text || "Turn aborted", { seq: ev.seq, extraClass: "stopped" });
      } else if (ev.kind === "cron_result") {
        const extra = p.status === "aborted" ? "stopped" : "";
        add("assistant", p.text || "Scheduled task finished.", { seq: ev.seq, extraClass: extra });
      } else if (ev.kind === "turn_interrupted") {
        renderStopped(ev.seq);
      } else if (ev.kind === "subagent_event") {
        const inner = p.event || {};
        const tag = "\u21b3 subagent " + String(p.subagent_id || "").slice(0, 8) + " " + (inner.kind || "");
        add("tool", tag + " " + JSON.stringify(inner.payload || {}).slice(0, 240), { seq: ev.seq });
      } else {
        add("tool", ev.kind + " " + JSON.stringify(p).slice(0,400), { seq: ev.seq });
      }
    }
    function renderStopped(seq) {
      const el = add("assistant", "Stopped", { extraClass: "stopped", seq: seq });
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const cont = document.createElement("button");
      cont.type = "button";
      cont.textContent = "Continue";
      cont.onclick = () => continueTurn();
      actions.appendChild(cont);
      el.appendChild(actions);
      return el;
    }
    function qlist(sid) {
      if (!sid) return [];
      if (!followupQueues.has(sid)) {
        try {
          const raw = sessionStorage.getItem("orbweaver.queue." + sid);
          followupQueues.set(sid, raw ? JSON.parse(raw) : []);
        } catch (e) { followupQueues.set(sid, []); }
      }
      return followupQueues.get(sid);
    }
    function persistQueue(sid) {
      const items = qlist(sid);
      const key = "orbweaver.queue." + sid;
      if (items.length) sessionStorage.setItem(key, JSON.stringify(items));
      else sessionStorage.removeItem(key);
    }
    function paintFollowups() {
      const root = $("followups");
      const sid = currentSid();
      const items = qlist(sid);
      root.replaceChildren();
      if (!items.length) { root.classList.add("hidden"); return; }
      root.classList.remove("hidden");
      items.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "q-item";
        const lab = document.createElement("span");
        lab.className = "q-lab";

        if ((ev.kind === "tool_result" || ev.kind === "MemoryRecall") && p.tool_use_id) {

    function openSessionWs(sid) {

      // the URL so it never lands in access logs; the gateway echoes "bearer".
      const tok = $("token").value.trim();

    function streamTurn(sid, payload, onEvent) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let ws;
        const finish = (fn, val) => {
          if (settled) return;
          settled = true;
          try { if (ws) ws.close(); } catch (e) {}
          fn(val);
        };
        try { ws = openSessionWs(sid); }
        catch (e) { reject(e); return; }
        ws.onopen = () => {
          try { ws.send(JSON.stringify(payload)); }
          catch (e) { finish(reject, e); }
        };
        ws.onmessage = (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); }
          catch (e) { finish(reject, e); return; }
          if (msg.kind === "subscribed" || msg.kind === "pong" || msg.kind === "cancelling" || msg.kind === "idle") {
            return;
          }
          if (msg.kind === "error") {
            const detail = msg.detail;
            finish(reject, new Error(typeof detail === "string" ? detail : JSON.stringify(detail)));
            return;
          }
          if (msg.kind === "turn_done") {
            finish(resolve, { status: msg.status || "ok", user_seq: msg.user_seq });
            return;
          }
          if (onEvent) onEvent(msg);
        };
        ws.onerror = () => finish(reject, new Error("WebSocket error"));
        ws.onclose = (ev) => {
          if (settled) return;
          if (ev.code === 4401) finish(reject, new Error("unauthorized"));
          else if (ev.code === 4404) finish(reject, new Error("session not found"));
          else finish(reject, new Error("WebSocket closed (" + ev.code + ")"));
        };
      });
    }
    async function continueTurn() {

      if (!sid) return;
      stoppedSids.delete(sid);
      waitingAskSids.delete(sid);
      const ph = $("log").querySelector(".placeholder");
      if (ph) ph.remove();
      $("log").querySelectorAll(".msg.stopped").forEach((n) => n.remove());
      const workingEl = add("assistant", "Working…", { extraClass: "working" });
      let resolveDone;
      const done = new Promise((r) => { resolveDone = r; });
      inFlight = { sid, text: "", userEl: null, workingEl, done };
      syncComposer();
      $("status").textContent = "working…";
      try {
        const r = await streamTurn(sid, { resume: true }, (ev) => {
          if (currentSid() !== sid) return;
          renderEvent(ev);
          if (workingEl && workingEl.parentNode) $("log").appendChild(workingEl);
        });
        if (workingEl.parentNode) workingEl.remove();
        if (currentSid() === sid) {
          if (r.status === "waiting_ask") waitingAskSids.add(sid);
          if (r.status === "stopped") stoppedSids.add(sid);
        }
        await refreshSessions();
        await drainQueue(sid, r.status);
      } catch (e) {
        if (workingEl.parentNode) workingEl.remove();
        if (currentSid() === sid) add("tool", String(e));
      } finally {
        if (inFlight && inFlight.sid === sid) inFlight = null;
        if (resolveDone) resolveDone();
        syncComposer();
        if ($("status").textContent === "working…") $("status").textContent = "";
      }
    }
    async function drainQueue(sid, status) {
      if (status !== "ok") return;
      if (currentSid() !== sid) return;
      const items = qlist(sid);
      if (!items.length) return;
      const next = items.shift();
      persistQueue(sid);
      paintFollowups();
      $("text").value = next.text;
      await send();
    }
    async function send() {
      if (inFlight) return;
      const text = $("text").value.trim();
      if (!text) return;
      if (!currentSid()) {
        try { await createSession($("wuri").value, $("wkind").value); }
        catch (e) { add("tool", String(e)); return; }
      }
      persistSid();
      const sid = currentSid();
      stoppedSids.delete(sid);
      waitingAskSids.delete(sid);
      const ph = $("log").querySelector(".placeholder");
      if (ph) ph.remove();
      $("text").value = "";
      const userEl = add("user", text, { extraClass: "pending" });
      attachUserActions(userEl, text, null, true);
      const workingEl = add("assistant", "Working…", { extraClass: "working" });
      let resolveDone;
      const done = new Promise((r) => { resolveDone = r; });
      inFlight = { sid, text, userEl, workingEl, done };
      syncComposer();
      $("status").textContent = "working…";
      try {
        const r = await streamTurn(sid, { text }, (ev) => {
          if (currentSid() !== sid) return;
          if (ev.kind === "user") {
            if (userEl) {
              userEl.classList.remove("pending");
              if (ev.seq != null) userEl.dataset.seq = String(ev.seq);
              attachUserActions(userEl, text, ev.seq, false);
            }
            return;
          }
          renderEvent(ev);
          if (workingEl && workingEl.parentNode) $("log").appendChild(workingEl);
        });
        const stillHere = currentSid() === sid;
        if (workingEl.parentNode) workingEl.remove();
        if (userEl) userEl.classList.remove("pending");
        if (r.status === "discarded") {
          if (r.user_seq != null) dropFromSeq(r.user_seq);
          if (userEl && userEl.parentNode) userEl.remove();
          if (stillHere) ensurePlaceholder();
        } else if (stillHere) {
          if (userEl && r.user_seq != null) userEl.dataset.seq = String(r.user_seq);
          if (userEl) attachUserActions(userEl, text, r.user_seq, false);
          syncRestoreDefaults();
          if (r.status === "waiting_ask") waitingAskSids.add(sid);
          if (r.status === "stopped") stoppedSids.add(sid);
        }
        await refreshSessions();
        if (stillHere) {
          const cur = currentSession();
          if (cur) $("chat-title").textContent = cur.title || "New chat";
        }
        await drainQueue(sid, r.status);
      } catch (e) {
        if (workingEl.parentNode) workingEl.remove();
        if (userEl) userEl.classList.remove("pending");
        if (currentSid() === sid) add("tool", String(e));
      } finally {
        if (inFlight && inFlight.sid === sid) inFlight = null;
        if (resolveDone) resolveDone();
        syncComposer();
        if ($("status").textContent === "working…") $("status").textContent = "";
      }
    }
    $("send").onclick = () => { if (inFlight && inFlight.sid === currentSid()) stopTurn(); else send(); };
    $("queue-btn").onclick = () => enqueue($("text").value.trim());
    $("inject").onclick = () => injectNow();
    $("continue").onclick = () => continueTurn();
    $("text").addEventListener("input", syncComposer);
    $("text").addEventListener("keydown", (e) => {
      if (e.key === "Escape" && inFlight) { e.preventDefault(); stopTurn(); return; }
      if (e.key !== "Enter" || e.repeat || e.isComposing) return;
      if (e.shiftKey) return;
      const busy = !!(inFlight && inFlight.sid === currentSid());
      if (busy && (e.ctrlKey || e.metaKey)) { e.preventDefault(); injectNow(); return; }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      if (busy) enqueue($("text").value.trim());
      else send();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !inFlight) return;
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      e.preventDefault();
      stopTurn();
    });
    $("mic").onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.start();
      $("status").textContent = "recording…";
      await new Promise((r) => setTimeout(r, 4000));
      rec.stop();
      await new Promise((r) => rec.onstop = r);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      const fd = new FormData();
      fd.append("file", blob, "clip.webm");
      const tok = $("token").value.trim();
      const res = await fetch($("base").value + "/v1/stt", {
        method: "POST",
        headers: tok ? { authorization: "Bearer " + tok } : {},
        body: fd
      });
      const data = await res.json();
      if (data.text) { $("text").value = data.text; $("status").textContent = "transcribed"; }
      else { $("status").textContent = JSON.stringify(data); }
    };

    (async function boot() {
      _initAutoscroll();
      await refreshSessions();
      if (!currentSid() && sessions.length) {
        setActive(sessions[0], { skipHistory: true });
      }
      await loadHistory();
      syncComposer();
    })();
  </script>
</body>
</html>
