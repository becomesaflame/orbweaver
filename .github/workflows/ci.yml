name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: python -m pytest ../tests -q
        working-directory: backend

  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main from release-candidate
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "origin/main is not an ancestor of release-candidate; refusing non-FF promote"
            exit 1
          fi
          git push origin HEAD:refs/heads/main

  deploy:
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-candidate' && vars.LIVE_HOST_DEPLOY == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - name: Update live checkout
        run: /home/orbweaver/orbweaver/deploy/update-live.sh
