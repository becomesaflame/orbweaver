name: ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap ripgrep
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: python -m ruff check backend tests --config backend/pyproject.toml
      - run: python -m mypy --config-file pyproject.toml orbweaver
        working-directory: backend
      - run: python -m pytest ../tests -q
        working-directory: backend
      - run: npm ci
        working-directory: vscode
      - run: npx tsc -p . --noEmit
        working-directory: vscode

  # Chromium-only web chat smoke. Set repository variable SKIP_PLAYWRIGHT=true
  # if GitHub-hosted runners flake; ruff/mypy/tsc still gate the PR.
  playwright:
    if: vars.SKIP_PLAYWRIGHT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: npm install
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

  # Compose integration is not in this workflow: Postgres + gateway on
  # GitHub-hosted runners is not deterministic enough to fail closed.
