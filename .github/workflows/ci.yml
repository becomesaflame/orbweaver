name: ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_SYSTEM_PYTHON: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      # ubuntu-latest is 24.04 (noble) amd64. Skip apt-get update; dpkg the
      # noble packages GitHub's own install used (bubblewrap from noble-updates,
      # ripgrep from noble/universe).
      - name: Install bubblewrap and ripgrep
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bubblewrap.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.1_amd64.deb
          curl -fsSL -o /tmp/ripgrep.deb \
            http://archive.ubuntu.com/ubuntu/pool/universe/r/rust-ripgrep/ripgrep_14.1.0-1_amd64.deb
          sudo dpkg -i /tmp/bubblewrap.deb /tmp/ripgrep.deb
      # Ubuntu 24.04 withholds CAP_NET_ADMIN in unprivileged userns, so
      # bwrap --unshare-net dies with RTM_NEWADDR. Same profile as README.
      - name: Allow bwrap netns
        run: |
          set -euo pipefail
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap || \
            echo "apparmor_parser failed (will try sysctl if the probe still fails)"
          probe() {
            bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent \
              --ro-bind / / --proc /proc --dev /dev -- /bin/true 2>&1 || true
          }
          out=$(probe)
          if grep -qiE 'rtm_newaddr|loopback:' <<<"$out"; then
            echo "AppArmor profile did not unlock bwrap netns; disabling apparmor_restrict_unprivileged_userns"
            echo "$out"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            out=$(probe)
          fi
          if grep -qiE 'rtm_newaddr|loopback:' <<<"$out"; then
            echo "bwrap netns still blocked:"
            echo "$out"
            exit 1
          fi
          echo "bwrap netns probe ok"
      - run: uv pip install -e ".[dev]"
        working-directory: backend
      - run: python -m ruff check backend tests --config backend/pyproject.toml
      - name: mypy and pytest
        working-directory: backend
        run: |
          set -uo pipefail
          python -m mypy --config-file pyproject.toml orbweaver \
            >"${RUNNER_TEMP}/mypy.log" 2>&1 &
          mypy_pid=$!
          pytest_ec=0
          python -m pytest ../tests -q || pytest_ec=$?
          mypy_ec=0
          wait "$mypy_pid" || mypy_ec=$?
          echo "::group::mypy"
          cat "${RUNNER_TEMP}/mypy.log"
          echo "::endgroup::"
          if [ "$mypy_ec" -ne 0 ]; then
            echo "mypy failed ($mypy_ec)" >&2
          fi
          if [ "$pytest_ec" -ne 0 ]; then
            echo "pytest failed ($pytest_ec)" >&2
          fi
          if [ "$mypy_ec" -ne 0 ]; then
            exit "$mypy_ec"
          fi
          exit "$pytest_ec"

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
        working-directory: vscode
      - run: npx tsc -p . --noEmit
        working-directory: vscode

  # Web chat smoke against the runner's preinstalled Google Chrome
  # (channel: chrome). Set repository variable SKIP_PLAYWRIGHT=true if
  # GitHub-hosted runners flake; ruff/mypy/tsc still gate the PR.
  playwright:
    if: vars.SKIP_PLAYWRIGHT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_SYSTEM_PYTHON: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv pip install -e ".[dev]"
        working-directory: backend
      - run: npm install
        working-directory: web
      - run: npx playwright test
        working-directory: web

  # Compose integration is not in this workflow: Postgres + gateway on
  # GitHub-hosted runners is not deterministic enough to fail closed.
