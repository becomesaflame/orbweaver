name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: vars.LIVE_HOST_DEPLOY == 'true'
    runs-on: [self-hosted, linux]
    env:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    steps:
      - name: Update live checkout
        run: /home/orbweaver/orbweaver/deploy/update-live.sh
